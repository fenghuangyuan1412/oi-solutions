id: P1752
title: 点菜
source: luogu
url: https://www.luogu.com.cn/problem/P1752
alias: 改编自 IOI 2013 Day 2 T2（Robots）
topics: [greedy/exchange-argument, greedy/heap-greedy, math/binary-search-answer]
difficulty: 省选/NOI−（洛谷 difficulty=7）
tags: [二分答案, 贪心, 交换论证, 优先队列, 大根堆, 最大化容量分配]
complexity:
  time: O(m log^2 m)（每次 check O(m log m) × 二分 log m 次；满约束 n=5e4/m=2e5 实测最慢 0.654 s，时限 1.00 s）
  space: O(n + m)
status: 未本地评测（无洛谷登录，仅本地自测）；对拍验证（与独立网络流暴力 6800 组随机 + 官方样例，0 不一致）；官方样例本地输出 3
visualization: true
limits: p+q <= n <= 50000, m <= 200000；时间 1.00 s，内存 125.00MB（洛谷页面）
samples:
  - in: |
      2 3 1 1
      5 2
      5 3
      6 4
      5
      1
    out: |
      3
sample_note: 官方样例（洛谷题目页"输入输出样例"，真浏览器读取）；本地 solution.cpp 与 verify/brute.cpp 均输出 3
verify:
  compile: g++ -static -O2 -std=c++14 solution.cpp -o sol.exe
  stress: node verify/stress.js ./sol.exe ./verify/brute.exe 5000 6 8   # 另有 1500 组(15/25)、300 组(30/40)
  extra: |
    sol vs 网络流暴力：5000 组（n<=6,m<=8）+ 1500 组（n<=15,m<=25）+ 300 组（n<=30,m<=40）= 6800 组，0 不一致
    生成器含全挑剔/全贫穷/无普通人/有普通人四种配比，1/3 组值域压到 0..2 轰炸等号边界
    满约束 4 组（n=5e4, m=2e5）：0.295~0.654 s；-1 路径 0.295 s
    详见 verify/RESULTS.md（所有数字均为本机实测）
notes: |
  二分周数 + "分配视角"判定：每人每周一道 => week 周每人 week 道，排周次与判定无关。
  判定时最挑剔的人先从"够格菜池"（价格大根堆，按美味度降序分 p 批进堆）取最贵 week 道，
  穷人从最富的开始，吃不起的堆顶记 forced 甩给普通人，最后 forced+堆剩 <= (n-p-q)*week 即可行。
  坑：菜的美味度/价格必须捆绑排序（本目录第一版拆两数组各排各的，对拍第 10 组立刻抓出）；
  z*week 最大 1e10 要 long long；二分上界是 m 不是 ceil(m/n)（官方样例 n=2,m=3 答案 3 即反例）。
authoring_note: 代码一律 C++14；verify/ 下的 brute.cpp（Dinic 网络流暴力）、stress.js（对拍驱动）仅用于验证，非讲解代码
