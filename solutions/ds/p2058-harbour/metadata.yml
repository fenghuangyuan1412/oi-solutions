notes: |
  唯一的坑是窗口左开右闭 (t_i-86400, t_i]：过期判定必须写 t <= t_i-86400（等于左边界也要弹）。
  实测把 <= 写成 < 时样例 #1 碰巧全对、样例 #2 第 3 行变 4（第 4 行又被盖回 4），
  随机 20 万组里错 4 万余组，所以"只看最后一行输出"发现不了这个 bug。
