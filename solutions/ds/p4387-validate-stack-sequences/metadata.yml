id: P4387
title: "【深基15.习9】验证栈序列"
source: luogu
url: https://www.luogu.com.cn/problem/P4387
alias: 洛谷训练单 320175
topics: [ds/stack, greedy/simulation]
difficulty: 普及-
tags: [栈, 贪心, 模拟, 交换论证]
complexity:
  time: O(n)
  space: O(n)
status: 本地 g++ -static -O2 -std=c++14 编译运行，官方样例输出 Yes / No 正确；与"DFS 穷举所有压弹调度"的暴力随机对拍 30000 组 0 不一致，另用编译好的 C++ 程序复核 200 组 0 不一致；n=1e5 反序压力 2ms；未在洛谷提交
visualization: true
samples:
  - in: |
      2
      5
      1 2 3 4 5
      5 4 3 2 1
      4
      1 2 3 4
      2 4 1 3
    out: |
      Yes
      No
notes: |
  入栈序列是任意排列、不一定是 1..n，必须按给定 pushed 顺序模拟；一次压入后要用 while 连续弹出，
  判据是"全部 n 个都弹出(j==n)"而不是"栈空"。
