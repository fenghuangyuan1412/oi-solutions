id: P9753
title: "[CSP-S 2023] 消消乐"
source: luogu
url: https://www.luogu.com.cn/problem/P9753
topics: [dp/interval, ds/stack, string/prefix-state]
difficulty: 提高+（洛谷 difficulty=5）
complexity:
  time: O(26n) 正解 / O(n^2) 逐左端点约简（中间档推荐） / O(n^3) 最坏 区间 DP（solution_partial.cpp） / 指数级 枚举子串+DFS（只到 n≈100）
  space: O(n) 正解（5 个 int 数组 + 1 个 char 数组，约 21n 字节）/ O(n^2) 区间 DP
status: 未本地评测（洛谷提交需登录）。本地 g++ -static -O2 -std=c++14 编译，官方样例输出 5 逐字正确；`node verify.js`（约 6 s，加 partial 参数约 11 s）可整批复现：23490 组穷举（{a,b}≤12、{a,b,c}≤8、{a,b,c,d}≤6）上"按定义 DFS"与"逐子串栈约简"两个参照 0 不一致，正解的 JS 镜像与定义也 0 不一致，而"按栈深发号"的错误镜像有 12798 组不一致；正解可执行文件另测 504 组（n≤35）与 135 组（n≤300）0 不一致，骗分版（区间 DP）在同一批 504 组上 0 不一致；性质 B 版另测 8340 组纯 a/b 串 0 不一致；n=2×10^6 四种构造串实测 23~29 ms（含进程启动，均在 1000 ms 时限内），n=800/8000/2×10^5 各档实测见 README 第一节
visualization: false
verify: verify.js   # 穷举 + 抽样对撞，仅用于验证，非讲解代码
notes: >-
  收尾说明：上一版 solution.cpp（按"栈深"给栈内容发编号）经实测是错的——官方样例输出 10（正确 5），
  最短反例 aab 输出 2（正确 1），穷举 23490 组里 12798 组不一致；已换成按 (父编号, 字符) 唯一化的
  O(26n) 树编号版（无哈希、确定性），错误写法作为"易错点 1"保留在 README。
  正解三步：①删 aa->ε 是合流的（临界对只有 aaa），故"栈约简后为空"⇔"可消除"；
  ②子串 s[l..r] 可消 ⇔ 前缀 l-1 与前缀 r 的栈内容相同 ⇒ 答案 = 相同前缀状态的对数；
  ③所有栈内容构成一棵树，给 (父编号, 字符) 发号即可比状态，兄弟 ≤26 个暴力扫，O(26n)。
  n=2×10^6 时 O(n^2)=4×10^12 比 1 秒预算大 4 个数量级，内存也开不下 n^2 表 ⇒ 只能 O(n)/O(n log n)。
  骗分阶梯（实测）：n≤10 用定义 DFS（8 ms，同代码放开阈值后 n=100 已要 548 ms、n≥150 本机 10 秒后终止）；
  n≤800 区间 DP 5~20 ms 稳过；n≤8000 区间 DP 看数据长相（随机 71 ms、a/b 318 ms、aabb 循环 7604 ms 超时限、
  全同字符 10 秒后终止），应改用 O(n^2) 逐左端点约简（45~88 ms）；性质 A（随机串）只枚举长度 ≤20 的子串
  （14/65 ms，输出与正解一致 8280/82779，但在 a/b 串上把 1059213312 算成 5394418、全同字符算成 19999900，
  仅随机数据可用）；性质 B（只有 a、b）用 (栈深, 栈底字符) 当状态桶，O(n)（2×10^5 实测 10 ms、2×10^6 24 ms，
  答案与正解一致）。按 20 个测试点均分估算：写到 n≤8000 档约 50 分，再加性质 A/B 约 70 分。
  数值坑：答案可达 C(2×10^6+1,2)≈2×10^12，int 版在官方样例上仍是 5（看不出），但 n=2×10^5 全同字符输出
  1410065408（真值 10000000000）、n=2×10^6 输出 -727379968（真值 1000000000000）。
  其余易错点均已编译错误版实测并贴在 README：漏空前缀→样例 3；先自增再累加→13；奇偶剪枝写反→25；
  区间 DP 忘拼接→4。编译必须加 -static（不加时本机实测 0 字节输出）。样例 2/3/4 是洛谷附件，本地无，只用样例 1。
  验证脚手架：本目录 verify.js 一条命令跑完上面所有对撞（数据全部脚本内确定性生成，不读外部文件）；
  计时用的构造数据生成器 time9753.js / gen9753.js 与多版本对照 src/multi9753.cpp 在仓库外的
  E:/ai/suanfa_study/.raw/，仅用于验证，不是讲解代码。
