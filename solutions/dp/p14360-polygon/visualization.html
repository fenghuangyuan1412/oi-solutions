<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P14360 多边形 · 极值锚定 + 背包计数分步演示</title>
<style>
  :root{--bg:#0f1220;--card:#1a1f35;--ink:#e8ecff;--dim:#8b93b5;--acc:#5eead4;--bad:#f59e6b;--good:#5eead4;--line:#262c4a;}
  *{box-sizing:border-box}
  body{margin:0;padding:22px;background:var(--bg);color:var(--ink);font:15px/1.6 "Segoe UI",system-ui,sans-serif}
  h1{font-size:19px;margin:0 0 2px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
  .card h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:0 0 10px}
  button{background:#2b3358;color:var(--ink);border:1px solid #3d4778;border-radius:8px;padding:7px 13px;font-size:13px;cursor:pointer;margin-right:6px}
  button:hover:not(:disabled){background:#394373}
  button:disabled{opacity:.35;cursor:not-allowed}
  input[type=text]{background:#0d1020;color:var(--ink);border:1px solid #3d4778;border-radius:8px;padding:7px 10px;font:13px Consolas,monospace;width:230px}
  .sticks{display:flex;gap:6px;flex-wrap:wrap}
  .st{min-width:34px;padding:5px 7px;border-radius:7px;background:#232a4a;border:1px solid #333c66;text-align:center;font:14px Consolas,monospace}
  .st .i{display:block;font-size:9px;color:var(--dim)}
  .st.pre{background:#16323f;border-color:#2b6a7f}
  .st.anchor{background:#3d2b58;border-color:#9d6bff;font-weight:700;box-shadow:0 0 0 2px #9d6bff55}
  .st.future{opacity:.35}
  .hist{position:relative;display:flex;align-items:flex-end;gap:2px;height:160px;border-bottom:1px solid #3a4270;padding-bottom:0}
  .bar{flex:1;background:var(--good);border-radius:3px 3px 0 0;min-height:1px;transition:height .2s}
  .bar.bad{background:var(--bad)}
  .bar.zero{background:#252b4a;min-height:2px;opacity:.5}
  .thr{position:absolute;top:-4px;bottom:0;width:2px;background:#9d6bff}
  .thr::after{content:attr(data-l);position:absolute;top:-16px;left:-14px;font-size:10px;color:#c4a6ff;white-space:nowrap}
  .axis{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-top:3px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
  .k{background:#131730;border:1px solid var(--line);border-radius:9px;padding:9px 11px}
  .k .lab{font-size:11px;color:var(--dim)}
  .k .val{font:20px Consolas,monospace;margin-top:2px}
  .k.badk .val{color:var(--bad)} .k.goodk .val{color:var(--good)} .k.ans .val{color:#c4a6ff}
  .note{color:var(--dim);font-size:14px;min-height:52px}
  .note b{color:var(--ink)}
  .row{display:flex;gap:14px;flex-wrap:wrap}.row>div{flex:1;min-width:290px}
  .top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .prog{color:var(--dim);font-size:12px;margin-left:auto}
  table{width:100%;border-collapse:collapse;font:12px Consolas,monospace}
  th,td{padding:3px 6px;border-bottom:1px solid #222743;text-align:right}
  th:first-child,td:first-child{text-align:left}
  tr.cur td{background:#242c52;color:var(--acc)}
</style>
</head>
<body>
<h1>P14360 [CSP-J 2025] 多边形</h1>
<div class="sub">极值锚定 i 为最长边 → 合法方案 = 前 i-1 根的子集总数 2^(i-1) 减去"和 ≤ a[i]"的坏子集（计数型 01 背包前缀和）。演示用小数据，不取模。</div>

<div class="top">
  <input type="text" id="src" value="1 2 3 4 5" placeholder="空格分隔，如 2 2 3 8 10">
  <button id="load">载入</button>
  <button id="prev">◀ 上一步</button>
  <button id="next">下一步 ▶</button>
  <button id="play">▶ 自动</button>
  <span class="prog" id="prog"></span>
</div>

<div class="card"><h2>① 升序排序后，选定的锚点 i（最长边）</h2><div class="sticks" id="sticks"></div></div>
<div class="card"><h2>② 前 i-1 根的子集和直方图 f[s]（橙=坏 ≤ a[i]，青=合法）</h2>
  <div class="hist" id="hist"></div>
  <div class="axis"><span>s=0（空集）</span><span>子集和 s →</span><span id="maxlab"></span></div>
</div>
<div class="row">
  <div class="card"><h2>③ 本轮计数</h2>
    <div class="grid">
      <div class="k"><div class="lab">前缀元素数</div><div class="val" id="kk">-</div></div>
      <div class="k"><div class="lab">子集总数 2^(i-1)</div><div class="val" id="tot">-</div></div>
      <div class="k badk"><div class="lab">坏子集 (和≤a[i])</div><div class="val" id="bad">-</div></div>
      <div class="k goodk"><div class="lab">本轮合法</div><div class="val" id="good">-</div></div>
    </div>
    <div class="k ans" style="margin-top:10px"><div class="lab">累计答案 ans</div><div class="val" id="ans">0</div></div>
    <div class="note" id="note" style="margin-top:10px"></div>
  </div>
  <div class="card"><h2>④ 各锚点明细</h2><div id="tbl"></div></div>
</div>

<script>
let A=[], F=[], MAXS=0, steps=[], t=0, timer=null, detail=[];

function compute(){
  MAXS = Math.max(...A);
  F = [new Array(MAXS+1).fill(0)];
  F[0][0] = 1;
  for(let k=1;k<=A.length;k++){
    const prev=F[k-1], cur=prev.slice();
    for(let s=MAXS;s>=A[k-1];s--) cur[s]+=prev[s-A[k-1]];
    F.push(cur);
  }
  detail=[]; let acc=0;
  for(let i=3;i<=A.length;i++){
    const anchor=A[i-1], f=F[i-1];
    let bad=0; for(let s=0;s<=anchor;s++) bad+=f[s];
    const tot=Math.pow(2,i-1), good=tot-bad; acc+=good;
    detail.push({i,anchor,tot,bad,good,acc});
  }
  steps=[{kind:'init'}];
  for(let j=0;j<detail.length;j++) steps.push({kind:'anchor',j});
  steps.push({kind:'done'});
}

function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}

function render(){
  const st=steps[t], n=A.length;
  const sb=document.getElementById('sticks'); sb.innerHTML='';
  const anchorIdx = st.kind==='init' ? -1 : (st.kind==='done' ? n : detail[st.j].i);
  for(let i=1;i<=n;i++){
    let cls='st future';
    if(anchorIdx>0){ if(i<anchorIdx) cls='st pre'; else if(i===anchorIdx) cls='st anchor'; }
    const b=el('div',cls); b.appendChild(el('span',null,A[i-1])); b.appendChild(el('span','i','a['+i+']'));
    sb.appendChild(b);
  }

  const hi=document.getElementById('hist'); hi.innerHTML='';
  document.getElementById('maxlab').textContent='s='+MAXS;
  const fk = st.kind==='init' ? F[Math.max(0,n)] : (st.kind==='done' ? F[n] : F[detail[st.j].i-1]);
  const thr = st.kind==='anchor' ? detail[st.j].anchor : null;
  const mx = Math.max(1,...fk);
  for(let s=0;s<=MAXS;s++){
    const v=fk[s]||0;
    const bar=el('div','bar'+(v===0?' zero':'')+(thr!==null&&s<=thr?' bad':''));
    bar.style.height=(v/mx*150)+'px'; bar.title='和='+s+' 的子集数='+v;
    hi.appendChild(bar);
  }
  if(thr!==null){
    const line=el('div','thr'); line.style.left=((thr+0.5)/(MAXS+1)*100)+'%';
    line.dataset.l='a['+detail[st.j].i+']='+thr; hi.appendChild(line);
  }

  const set=(id,v)=>document.getElementById(id).textContent=v;
  const rows=detail.map((d,j)=>`<tr class="${st.kind==='anchor'&&st.j===j?'cur':''}"><td>i=${d.i} (a=${d.anchor})</td><td>${d.tot}</td><td>${d.bad}</td><td>${d.good}</td><td>${d.acc}</td></tr>`).join('');
  document.getElementById('tbl').innerHTML='<table><tr><th>锚点</th><th>2^(i-1)</th><th>坏</th><th>合法</th><th>累计</th></tr>'+rows+'</table>';

  const cur = st.kind==='anchor' ? detail[st.j] : (st.kind==='done' ? detail[detail.length-1] : null);
  set('kk', cur?cur.i-1:'-'); set('tot',cur?cur.tot:'-'); set('bad',cur?cur.bad:'-');
  set('good',cur?cur.good:'-'); set('ans', st.kind==='done'?detail.reduce((x,d)=>x+d.good,0):(cur?cur.acc:0));

  const note=document.getElementById('note');
  if(st.kind==='init') note.innerHTML=`排序后 <b>${A.join(' ')}</b>。下面把每个下标 i≥3 当作"最长边"，橙柱是选了它之后<b>仍然拼不成多边形</b>的子集（其余之和 ≤ a[i]），青柱则能拼成。`;
  else if(st.kind==='anchor'){
    const d=detail[st.j];
    note.innerHTML=`锚点 <b>i=${d.i}</b>，最长边 <b>a[${d.i}]=${d.anchor}</b>。前 ${d.i-1} 根共 <b>${d.tot}</b> 个子集，其中和 ≤${d.anchor} 的有 <b>${d.bad}</b> 个（含空集与单根 —— 它们恰好是元素数不足 3 的情况，被自动排除）。故本轮合法 <b>${d.tot}-${d.bad}=${d.good}</b>。`;
  }
  else note.innerHTML=`累加完成：<b>ans=${detail.reduce((x,d)=>x+d.good,0)}</b>。每个子集被它的最大下标唯一认领，不重不漏；m≥3 无需额外处理。`;
  document.getElementById('prog').textContent=`步骤 ${t+1}/${steps.length}`;
  document.getElementById('prev').disabled=t===0;
  document.getElementById('next').disabled=t===steps.length-1;
}

function load(){
  const v=document.getElementById('src').value.trim().split(/[\s,]+/).map(Number).filter(x=>Number.isFinite(x)&&x>0);
  if(v.length<3||v.length>16||Math.max(...v)>60){alert('演示限制：3~16 根，长度 ≤60（真实数据 n≤5000 同理会跑，只是画不清）');return;}
  A=v.sort((x,y)=>x-y); t=0; compute(); render();
}
document.getElementById('load').onclick=load;
document.getElementById('next').onclick=()=>{if(t<steps.length-1){t++;render();}};
document.getElementById('prev').onclick=()=>{if(t>0){t--;render();}};
document.getElementById('play').onclick=e=>{
  if(timer){clearInterval(timer);timer=null;e.target.textContent='▶ 自动';return;}
  e.target.textContent='⏸ 暂停';
  timer=setInterval(()=>{if(t>=steps.length-1){clearInterval(timer);timer=null;e.target.textContent='▶ 自动';return;}t++;render();},900);
};
load();
</script>
</body>
</html>
