id: P1049
title: "[NOIP 2001 普及组] 装箱问题"
source: luogu
url: https://www.luogu.com.cn/problem/P1049
topics: [dp/knapsack]
difficulty: 普及-
tags: [01背包, 体积当价值, 滚动数组, 恰好装满]
complexity:
  time: O(nV)
  space: O(V)
status: 本地 g++ -static -O2 -std=c++14 编译通过，官方样例（V=24、6 件物品 8 3 12 7 9 7）输出 0 逐字核对一致；本题未做随机对拍（与 ../p1048-herbs 是同一个 01 背包骨架，只是"价值 = 体积"的取值不同，故未单独配 verify.js）；满数据 V=20000、n=30、体积随机输出 0，5 次运行 6.1 / 7.3 / 11.6 ms（最小/中位/最大，node execFileSync 起进程，含进程启动与 Defender 噪声）；错版实测：输出 f[V] 而不是 V-f[V] 时官方样例输出 24（正解 0）；未在洛谷提交
visualization: false
samples:
  - in: |
      24
      6
