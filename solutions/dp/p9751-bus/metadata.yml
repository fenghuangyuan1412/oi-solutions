id: P9751
title: "[CSP-J 2023] 旅游巴士"
source: luogu
url: https://www.luogu.com.cn/problem/P9751
topics: [dp/layered-graph, graph/bfs]
difficulty: 普及+/提高
complexity:
  time: O(k(n+m))（a_i=0 档分层 BFS）/ O(U·m)，U=max a+(n+1)k（通用档逐时刻模拟，精确但慢）
  space: O(nk + m)
status: 未本地评测（洛谷提交需登录）；本地 g++ -static -O2 -std=c++14 编译，官方样例输出 6 逐字正确；自造 n=1e4/m=2e4/k=100 全 0 数据实测 153 ms，n=10 级最坏数据实测 85 ms，同规模通用（a≠0）数据实测 5599 ms（超出 1s 时限，答案仍能算对）；另过 5 组手推小数据。本目录为骗分版，未实现正解
visualization: false
notes: 只讲骗分、不实现正解（正解是分层 DP，"同余类里早到不支配晚到"陷阱 + 去环上界引理细节多，本机无评测环境验证自创完整版，不假装实现）。骗分两档：①a_i=0（测试点 1~2、6~7、11~13）分层 BFS (v, 步数 mod k)；②小数据（测试点 3~5）逐时刻模拟 R_t，正确性靠界引理"若解存在，最早离开 ≤ max a+(n+1)k"（去环论证：同点同余数的环删掉并推迟上车时刻，离开时刻不变）。k=1 且 a=0 是档 1 的子产。易错点全部编译了错误版实测：忘"不许停留"输出 3；忘"离开须为 k 倍数"输出 2；忘"每 k 一辆车"输出 -1（正确 6）；界偷懒写小在自造数据上把 100 误报 -1（官方样例反而抓不住）。
