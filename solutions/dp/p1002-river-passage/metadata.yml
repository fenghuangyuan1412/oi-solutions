id: P1002
title: "[NOIP 2002 普及组] 过河卒"
source: luogu
url: https://www.luogu.com.cn/problem/P1002
alias: 入门 DP 十题（第一批）
topics: [dp/grid-counting, simulation/board]
difficulty: 入门~普及-
tags: [动态规划, 路径计数, 网格, 马的控制点, long long]
complexity:
  time: O(n*m)
  space: O(n*m)
status: 未本地评测（洛谷题目页需登录才能提交）；本地 g++ -static -O2 -std=c++14 编译通过，官方样例 6 6 3 3 输出 6 逐字正确；板书状态表由参考实现打印后与程序输出交叉核对（样例全盘 49 格一致）；满数据 20 20 1 1 输出 8119857900，5 次运行 4.9 / 5.7 / 11.1 ms（最小/中位/最大，含进程启动）；未做随机对拍（递推唯一，计数结果另有 7x7 全表可逐格手验）
visualization: true
samples:
  - in: |
      6 6 3 3
    out: |
      6
notes: |
  溢出实测（本题最重要的坑）：把 f 从 long long 改成 int 且 printf 同步改成 %d 后，
  官方样例 6 6 3 3 照样输出 6（完全看不出问题），但满数据 20 20 1 1 输出 -470076692，
  正解 8119857900 —— 8119857900 mod 2^32 回绕成负数。无障碍上界 C(40,20)=137846528820（BigInt 算出）。
  另外实测过"int 的 f 配 %lld"这种类型不符的版本，同一份满数据打出 3824890604（未定义行为，值不可信），
  README 用它说明"改类型必须同时改格式符"。
  板书表里两个必须讲的格子：(2,2)=0 与 (5,5)=0 —— 它们不是控制点，但两个入边来源都是控制点，
  "不可达"与"是控制点"是两回事；马本身那一格也要标（共 9 个点），且盘外的控制点必须丢弃。
  visualization.html 是 7x7 逐格填表动画，控制点先打叉，再一格一格显示"上方 + 左方"的来源高亮。
