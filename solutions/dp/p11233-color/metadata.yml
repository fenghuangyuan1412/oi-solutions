id: P11233
title: "[CSP-S 2024] 染色"
source: luogu
url: https://www.luogu.com.cn/problem/P11233
topics: [dp/linear, dp/state-design, dp/lazy-offset, basic/data-range-analysis]
difficulty: 提高+/省选-
complexity:
  time: O(n)（正解）/ O(n·V)，V = 数组里不同值的个数（骗分版）
  space: O(max A)（base_/seen/A/输入缓冲 ≈ 17 MB，按代码里数组尺寸算）
status: 未本地评测（洛谷提交需登录）；本地 g++ -static -O2 -std=c++14 编译两版均通过，官方样例输出 1 / 0 / 8 逐字正确；正解与 2 的幂暴力、O(n^2) 位置 DP、双坐标值域 DP 四版对拍 100 组 0 不一致，正解与骗分版另对拍 400 组 0 不一致；n=2e5、A_i<=1e6 极限单组两版同出 91596280；T=10 极限数据正解实测 64 ms、骗分版 60 s 无输出被终止
visualization: false
notes: >
  状态设计的钥匙：判分只看"左侧最靠近的同色数"，所以每种颜色只需记"最后一个数的值"；
  而染完第 i 个数后，它所在颜色的最后值就是 A[i]，于是自由度只剩一个（另一种颜色的最后值 v，v=0 表示没用过）。
  两条转移：同色 ⇒ 所有状态同时 +add（add = A[i]==A[i-1] ? A[i] : 0）；换色 ⇒ 只写 v=A[i-1] 这一格，
  值 = max(max_v f[v], f[A[i]] + A[i])。正解就是把"全体加同一个数"记成一个偏移量 shift（懒标记），
  base[v] = f[v] - shift，配一个全局最大值 baseG，得到 O(1) 转移、O(n) 总复杂度。
  骗分版保留两档：n<=20 走 2^n 枚举（本机实测单组 n=24 已 868 ms、n=26 3378 ms；最坏 T=10 下 n=20 是 496 ms、n=22 是 2142 ms，开关就是这么定下来的）；
  更大的 n 走遍历全部状态的 O(n·V) DP。按 20 个测试点均分推算能拿 65 分（1~10 + 13~15），
  13~15 档（n<=2e5 但 A_i<=10 ⇒ V<=11）实测 52 ms，是"被 n 吓住就会漏掉的一档"。
  11~12 档实测 6818 ms、16~20 档单组 70 s 超时。
  易错点全部编译了错误版实测：int shift ⇒ 极限数据输出 -1864462912（正解 199999000000）；
  忘加 shift ⇒ 官方样例仍输出 1 0 8（样例里没有相邻相等！），自造数据变 0 0 1 2 0 0；
  换色少减 add ⇒ 同样过样例，极限数据虚高成 399997000000；
  setb(x) 写错格子 ⇒ 样例 0 0 6；忘更新 baseG / 漏 v==x 的加分 ⇒ 样例 0 0 0。
  读题坑："最靠近"不是"存在"：官方解释里 1 2 1 全染红得 0 分。
  输入 200 万个数：同一算法 scanf 907 ms vs fread 快读 64 ms，scanf 版贴着 1 s 时限。
  验证工具在仓库外 .raw/（gen_p11233.js 造分档数据、p11233_mkbug2.js 派生错误版、
  shipcheck/dpcheck/cmp2 对拍），均仅用于验证，非讲解代码。
