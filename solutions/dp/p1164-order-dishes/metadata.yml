id: P1164
title: "小 A 点菜"
source: luogu
url: https://www.luogu.com.cn/problem/P1164
topics: [dp/knapsack]
difficulty: 普及
tags: [01背包, 方案数计数, 恰好装满, 整型溢出]
complexity:
  time: O(NM)
  space: O(M)
status: 本地 g++ -static -O2 -std=c++14 编译通过，官方样例（4 4 / 1 1 2 2）输出 3 逐字核对一致；node verify.js：与"枚举 2^N 个菜品子集、统计和恰好等于 M 的个数"的暴力随机对拍 400 组（N<=16、M<=40）0 不一致，定向边界自检全 OK；两个错版实测均跑官方样例——内层写成正序（完全背包）输出 14、漏 f[0]=1 输出 0，正解 3；满数据 N=100、M=10000 两种口径：价格取 9000..10000 输出 0（最小 4.9 / 中位 5.3 ms，最大值未记录），价格取 1..1000 的随机数据输出 2728559009139495181（约 2.7e18，5.4 / 6.2 ms），另一组同参数随机数据输出负数 -3350482870095781823（long long 也被打爆）；计时为 node execFileSync 起进程跑 5 次的 最小/中位/最大，含进程启动与 Defender 噪声；未在洛谷提交
visualization: false
samples:
  - in: |
      4 4
      1 1 2 2
    out: |
      3
notes: |
  交付精简：不做 HTML 动画，README 用「板书演示」表格（逐道菜 f[0..4] 整行 + 正序错版对比行）代替。
  板书数据由本机程序打印：
    第 1 道菜 1 元后 f[0..4] = 1 1 0 0 0
    第 2 道菜 1 元后 f[0..4] = 1 2 1 0 0
    第 3 道菜 2 元后 f[0..4] = 1 2 2 2 1
    第 4 道菜 2 元后 f[0..4] = 1 2 3 4 3   ← 答案 f[4]=3
    正序错版（完全背包）最后一行 = 1 2 5 8 14
  三个必讲点：
    1) "恰好花光"⇒ 答案取 f[M]，不是 max_{j<=M} f[j]（题面写着 2020.8.29 官方加过 hack 数据）；
    2) f[0]=1 的含义是"什么都不点是花 0 元的唯一方案"，它是所有转移的起点；
    3) 内层倒序保证每种菜只有一份。
  最重要的易错点是数据类型：题面只保证官方数据的最终答案 <= 2^31-1，中间量 f[j] 没有这个保证，
  自造数据下可远超 int、甚至超过 long long（实测输出负数），所以 long long 是底线而不是保险。
  与 ../p1048-herbs（价值独立、输出 f[V]）、../p1049-box-packing（体积当价值、输出 V-f[V]）
  构成 01 背包三种问法的对照，本 dir 是唯一带 verify.js 的计数版。
