complexity:
  time: O(sum_i 可达时刻数 * (该段车数 + 301))
  space: O(n * 600 + m)
status: 本地 g++ -static -O2 -std=c++14 编译运行，样例输出 0 / 061301 正确；node verify.js：闭式 DP vs 枚举每段时长的 DFS 随机对拍 20000 组 0 不一致，再用"10001 点采样判相遇"的第三种判据复核 300 组，判据不一致 0 组、采样暴力答案与 DP 不一致 0 组；n=49 / m=299 满规模随机数据 96 ms（连跑三轮 104/96/96 ms，首轮冷启动）；未在洛谷提交
visualization: false
samples:
  - in: |
      3 2
