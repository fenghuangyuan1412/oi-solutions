id: P1091
title: "[NOIP 2004 提高组] 合唱队形"
source: luogu
url: https://www.luogu.com.cn/problem/P1091
alias: 入门 DP 十题（第一批）
topics: [dp/lis, dp/linear, dp/bidirectional]
difficulty: 普及~普及+（双向 LIS 拼接，坑在峰重复计数）
tags: [LIS, 双向DP, 枚举峰, 严格单调, 峰减一]
complexity:
  time: O(n^2)
  space: O(n)
status: 本地 g++ -static -O2 -std=c++14 编译通过（本机两套 MinGW 冲突必须加 -static，否则退出码 139）；官方样例输入 8 / 186 186 150 200 160 130 197 220 输出 4，与 problem.txt 逐字核对一致；未做随机对拍（n<=100，O(n^2) 双向 LIS 即标准解，无独立且更慢的合法暴力），以程序打印的 up/down 三行数组表当自检；n=100（身高随机 130..230）满数据输出 77，5 次运行 4.7 / 4.9 / 10.8 ms（最小/中位/最大，含进程启动）；错版实测：峰被左右共用却忘减 1（up[k]+down[k]）后官方样例输出 3（正解 4）；未在洛谷提交
visualization: false
samples:
  - in: |
      8
      186 186 150 200 160 130 197 220
    out: |
      4
notes: |
  交付精简：不做 HTML 动画，README 用程序打印的板书表（t / up / down / up+down-1 四行）代替。
  板书数据：up = 1 1 1 2 2 1 3 4，down = 3 3 2 3 2 1 1 1，up+down-1 最大 4，答案 8-4=4。
  要点：两边都是严格单调（样例开头两个 186 是现成反例，相等不能配对）；
  down 数组是从右往左倒着求的 LIS；答案 = n - max_k(up[k]+down[k]-1)。
  变式提示：n 大时要换二分/BIT 的 O(n log n) LIS，本题 n<=100 用不上。
