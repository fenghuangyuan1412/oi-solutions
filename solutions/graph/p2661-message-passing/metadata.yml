id: P2661
title: "[NOIP 2015 提高组] 信息传递"
source: luogu
url: https://www.luogu.com.cn/problem/P2661
topics: [graph/smallest-cycle]
difficulty: 普及
complexity:
  time: O(n)
  space: O(n)
status: 未本地评测（洛谷提交需登录）；本地 g++ -static -O2 -std=c++14 编译通过，样例输出 3 逐字一致；与「逐轮模拟整个游戏」独立实现穷举 n=2..8 全部 17,650,827 个函数图 0 不一致、随机对拍 500 组 0 不一致；⚠️ 满约束发现递归爆栈：单一大环长度 ≥ 约 32480 即稳定段错误（Windows -static 默认 8MB 栈），n=2e5 整图一大环必崩（连续 5 次退出码 127）
visualization: true
notes: 核心是 vis（在本链）+ vis1（已完结）两个布尔的区分；关键实现细节是 vis1[now]=1 必须写在递归调用【之后】，否则第二次 dfs 被提前剪枝、一个环都找不到；另一个真实风险是递归深度——n≤2e5 时"第一次就一头扎进长环"的数据会爆 8MB 栈，建议改迭代版或开大栈
