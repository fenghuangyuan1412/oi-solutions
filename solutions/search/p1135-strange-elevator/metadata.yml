id: P1135
title: "奇怪的电梯"
source: luogu
url: https://www.luogu.com.cn/problem/P1135
alias: 洛谷 P1135 奇怪的电梯（楼层建模 + BFS）
topics: [search/bfs]
difficulty: 普及（洛谷页面标注难度 3）
tags: [建模建图, BFS, 每点两条出边, 无权图最短路, dist初值-1兼vis]
complexity:
  time: O(N)
  space: O(N)
status: 未本地评测（未在洛谷提交）；本机 g++ -static -O2 -std=c++14 -Wall 编译无警告；官方样例 5 1 5 / 3 3 1 2 5 输出 3 逐字一致；与 Floyd 最小按键数闭包参照（机制不同，O(N^3)）随机对拍 200 组（N<=60、K 含 0）0 不一致；定向用例 A==B 输出 0、不可达输出 -1、N=200 且 K 全 1 输出 199 均正确；极限 N=200（K 全 1 与固定种子随机 K 两种数据）实测 4~6 ms
limits: 1 <= N <= 200, 1 <= A,B <= N, 0 <= K_i <= N; 共 16 个测试点，前 15 个各 6 分，最后一个 10 分
visualization: false
files:
  problem.txt: 题面原文（洛谷页面抓取，scripts/parse_luogu.js 解析后整理）
  solution.cpp: 讲解代码（楼层=状态、+K/-K 两条出边的 BFS）
  verify.js: Node 验算脚本（样例逐字比对 + Floyd 参照对拍 200 组 + 定向边界用例 + N=200 计时），仅用于验证，非讲解代码
samples:
  - in: "5 1 5\n3 3 1 2 5"
    out: "3"
notes: |
  难点在建模：楼层当点、i->i+K[i] 与 i->i-K[i] 两条出边（越界=按钮失灵=边不存在），边全为 1 权 => BFS 层数即最少按键数，
  不需要 Dijkstra/DP。样例真实 BFS 轨迹：弹出顺序 1(0)->4(1)->2(2)->5(3)，dist=[0,2,-1,1,3]，3 楼谁都跳不到；
  路径是 1->4->2->5 而非 1->4->5（4 楼按上到 6 不存在、按下只能到 2）。
  与 P1443 同骨架（入队即打标记、-1 初值兼 vis、先判界再碰数组），课上适合做"换个问题场景"的迁移练习。
