id: P1036
title: "[NOIP 2002 普及组] 选数"
source: luogu
url: https://www.luogu.com.cn/problem/P1036
alias: NOIP2002 普及组 T2 选数
topics: [search/dfs, math/primality]
difficulty: 普及-（洛谷页面标注难度 2）
tags: [组合枚举, 回溯, 素数判定, 试除到根号, 参数带走 sum, 溢出算账]
complexity:
  time: O(C(n, k) * sqrt(k * max(x)))（最坏上界；本机实测见 status）
  space: O(n)
status: 未本地评测（未在洛谷提交）；本机 g++ -static -O2 -std=c++14 -Wall 编译无警告；官方样例 4 3 / 3 7 12 19 输出 1 正确，另 4 组手挑边界用例（含 1、全相同、n=1 k=0）全部与预期一致；与"位掩码枚举 2^n 子集 + 独立 6t±1 试除判素"参照实现随机对拍 200 组（n<=12，k<n，x_i 三档混合值域）0 不一致；极限 A：n=20 k=10、x_i 随机<=5e6（枚举 C(20,10)=184756 种组合）八轮实测 458~514 ms（时限 1500ms），答案与参照逐次一致；极限 B：n=20 k=19、x_i 取 4.5e6~5e6（最大和 9.4e7，sqrt 约 9707~9825）八轮实测 7~9 ms
limits: 1 <= n <= 20, k < n, 1 <= xi <= 5 * 10^6；时间 1500ms，内存 128MB
visualization: false
files:
  problem.txt: 题面原文（洛谷页面抓取，scripts/parse_luogu.js 解析后整理）
  solution.cpp: 讲课用代码：组合 DFS（sum 作参数带走）+ isPrime 试除到 i*i<=v
  verify.js: Node 验算脚本（官方样例与边界用例 / 位掩码参照对拍 200 组 / n=20 两档极限计时），仅用于验证，非讲解代码
  README.md: 讲稿正文（枚举层与判定层分离、素数边界讨论、溢出账、板书状态表、四种误写的实测输出）
samples:
  - in: "4 3\n3 7 12 19\n"
    out: "1\n"
notes: |
  两层分离：外层是 P1157 的组合枚举（下一层起点 = 上一个下标 + 1，不需要 vis[]，sum 用值传递带走所以回溯免费），内层是独立的判素函数。
  ans 统计的是"选法"而不是"不同的和值"：实测 n=4 k=2 x=1 1 1 1 输出 6（六种取法的和都是 2）。
  判素三个边界：v<2（1 不是素数）必须显式排除；v=2 时循环不进直接 true；完全平方数要求条件是 i*i<=v 而不是 i*i<v。
  实测误写后果：循环从 i=3 起（漏因子 2）官方样例输出 4（正确 1）；删掉 v<2 判非时官方样例仍为 1，但 3 1 / 1 2 4 变 2（正确 1）；i*i<v 时 3 2 / 2 7 9 变 2（9 被判素数）；按排列写法枚举官方样例输出 6（放大 k!=6 倍）。
  溢出账：k<=19、xi<=5e6 ⇒ 和最大 9.5e7，int 装得下；判素里 i*i 最大约 9.5e7 也在 int 内，但代码统一用 long long 以养成"先算账"的习惯。
  实测逐个整数试除已足够：最耗时档 n=20 k=10 为 458~514 ms，洛谷时限 1500ms；先筛素数表只是把单次试除上限从 9746 轮降到 1202 轮（pi(9747)=1202，本机算得）。
