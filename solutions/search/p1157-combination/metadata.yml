id: P1157
title: "组合的输出"
source: luogu
url: https://www.luogu.com.cn/problem/P1157
alias: 组合枚举输出（DFS 模板，与 P1706 对照讲）
topics: [search/dfs]
difficulty: 普及-（洛谷页面标注难度 2）
tags: [DFS, 组合, 起点递推, 字典序, setw 场宽, 位掩码对拍]
complexity:
  time: O(r * C(n, r))（输出规模）+ 递归结点 sum_{d=0}^{r} C(n, d)
  space: O(n)
status: 未本地评测（未在洛谷提交）；本机 g++ -static -O2 -std=c++14 -Wall 编译无警告；官方样例 n=5 r=3 内容逐字一致（10 行、每行 9 字符、行末无空格；本程序多打一个末尾换行，官方样例末行无换行）；与"位掩码枚举子集 + 显式字典序排序"参照实现随机对拍 120 组（n<=14，覆盖 67~79 种 (n,r) 含 r=0/r=n）逐字比对 0 不一致；极限 n=20 r=10 输出 184756 行、5727436 字符（= C(20,10)），与参照逐字一致，C++ 侧实测 92~118 ms（四轮 118/112/92/99），dfs 调用 616666 次（剪枝版 352716 次）
limits: 1 < n < 21, 0 <= r <= n；每个元素占 3 个场宽；组合按字典序输出
visualization: false
files:
  problem.txt: 题面原文（洛谷页面抓取，scripts/parse_luogu.js 解析后整理）
  solution.cpp: 讲课用代码：组合 DFS（下一层起点 = 上一个数 + 1）+ setw(3)，无 vis[]
  verify.js: Node 验算脚本（官方样例逐字比对 / 位掩码+显式排序参照对拍 120 组 / n=20,r=10 极限计时），仅用于验证，非讲解代码
  README.md: 讲稿正文（含 dfs(start,dep) 调用顺序表、排列 vs 组合对照表、五种误写的实测行数）
samples:
  - in: "5 3\n"
    out: "  1  2  3\n  1  2  4\n  1  2  5\n  1  3  4\n  1  3  5\n  1  4  5\n  2  3  4\n  2  3  5\n  2  4  5\n  3  4  5"
notes: |
  组合与排列的唯一差别：组合每层从"上一个数 + 1"试（dfs(x + 1, dep + 1)），天然不重复、行内升序、行间字典序，因此不需要 vis[]；排列每层从 1 试，必须 vis[] 去重并撤销。
  实测误写行数（n=5 r=3，正确 10 行）：下一层传 1 或传 start -> 125 行（=5^3）；传 x（漏 +1）-> 35 行（=C(n+r-1,r)）；按排列写法（vis 去重）-> 60 行（=P(5,3)）且第 4 行为 1 3 2 破坏行内升序。
  剪枝上界 x <= n - (r - dep) + 1 的 +1 不能少：少写会永远选不到最大的数，实测 n=5,r=3 只剩 4 行（123/124/134/234），n=20,r=10 剩 92378 行（恰为 C(19,10)），n=20,r=19 剩 1 行（应 20 行）。
  位掩码枚举按掩码升序输出不是字典序：实测 n=5,r=3 前 6 行为 123|124|134|234|125|135（字典序应为 123|124|125|134|135|145），参照实现必须显式排序。
  r = 0 时本程序输出一个空行（空集唯一一个），与参照一致；题面 0 <= r <= n 但洛谷期望未知，讲课时提醒学生注意这一档。
  读入顺序必须是 n 再 r：实测读反成 cin >> r >> n 时对官方样例输出 0 行。
