id: P1451
title: 求细胞数量
source: luogu
url: https://www.luogu.com.cn/problem/P1451
alias: 洛谷 P1451（四方向连通块计数）
topics: [search/dfs, ds/dsu]
difficulty: 洛谷难度 2
tags: [搜索, DFS, 洪水填充, 连通块计数, 四方向, 并查集（仅参照实现）]
complexity:
  time: "O(4*N*M)；实测 100x100 全 1 为 6 ms、随机（0 占 0.5）5 ms、竖条纹 4 ms（含进程启动）"
  space: "O(N*M) 网格 + vis + 递归栈（100x100 全 1 时约 1e4 层，本机正常结束）"
status: 未本地评测（未在洛谷提交）；本机 g++ -static -O2 -std=c++14 -Wall 编译无警告，官方样例输出 4 与题面逐字一致，与"并查集合并四邻域非 0 格后数根"参照实现随机对拍 200 组 0 不一致，极限规模 100x100 三组数据耗时 4~6 ms
limits: 1 <= n, m <= 100
visualization: false
files:
  problem.txt: 题面原文（洛谷页面抓取，scripts/parse_luogu.js 解析后整理）
  solution.cpp: 讲解代码（四方向 DFS 洪泛数连通块，进入即标记、永不撤销）
  verify.js: Node 验算脚本（官方样例逐字比对 + 并查集数根参照对拍 200 组 + 100x100 极限计时），仅用于验证，非讲解代码
samples:
  - in: |
      4 10
      0234500067
      1034560500
      2045600671
      0000000089
    out: |
      4
notes: |
  与 P1596 唯一的代码差异是偏移表：本题 4 个方向（题面"沿细胞数字上下左右"），P1596 是 8 个方向。
  第二处易误读：判据是"对方也是细胞数字（非 '0'）"，不要求数字相同。
  实测误用八方向时官方样例 4 -> 2；误以为"数字相同才同一细胞"时 4 -> 18；
  定向数据 10/01 四方向 2 块、八方向 1 块；110/001/001 四方向 2 块、八方向 1 块。
  vis 置位后绝不撤销（与 P1605 的回溯撤销对照）：数"块"不撤销，数"路径"才撤销。
  并查集参照数根前必须过滤顶点：官方样例 40 格中细胞格 21 个，只数细胞的根 = 4，
  对全部 40 格数根 = 23（把 19 个 '0' 格各算一块）。
  输入必须按字符串读整行（一行 m=100 位数字，用 int 读必溢出）。
