id: P1605
title: 迷宫
source: luogu
url: https://www.luogu.com.cn/problem/P1605
alias: 洛谷 P1605（DFS 路径计数入门）
topics: [search/dfs]
difficulty: 洛谷难度 2
tags: [搜索, DFS, 回溯, 路径计数, 网格, 撤销标记]
complexity:
  time: "指数级（枚举全部简单路径）；实测 5x5 挡中心一格 19545 次 dfs 调用 / 1456 条方案，5x5 全空 90111 次调用 / 8512 条方案"
  space: "O(N*M) 网格 + O(N*M) 递归栈（每层至少多占一格，5x5 最深约 25 层）"
status: 未本地评测（未在洛谷提交）；本机 g++ -static -O2 -std=c++14 -Wall 编译无警告，官方样例输出 1 与题面逐字一致，与"状态压缩 bitmask + 当前格逐层扩展"参照实现随机对拍 200 组 0 不一致，极限规模 5x5 / T=1 / 角到角方案数 1456 耗时 5~7 ms（含进程启动）
limits: 1 <= N,M <= 5, 1 <= T <= 10, 1 <= SX,FX <= N, 1 <= SY,FY <= M
visualization: false
files:
  problem.txt: 题面原文（洛谷页面抓取，scripts/parse_luogu.js 解析后整理）
  solution.cpp: 讲解代码（vis[] 回溯数简单路径：进入标记、返回撤销，与 P1596/P1451 的"不撤销"对照）
  verify.js: Node 验算脚本（官方样例逐字比对 + 状态压缩逐层扩展参照对拍 200 组 + 5x5 极限计时），仅用于验证，非讲解代码
samples:
  - in: |
      2 2 1
      1 1 2 2
      1 2
    out: |
      1
notes: |
  题面"每个方格最多经过一次" => 回溯时必须 vis[nx][ny] = false，vis 表示的是"当前这条路径"的集合，
  不是全局访问标记。这与 P1596 / P1451 / P1162 的"洪泛之后不撤销"正好是两类题（本批最重要的对比）。
  实测忘记撤销时：官方样例碰巧仍输出 1，3x3 全空由 12 变 1，5x5 挡中心由 1456 变 1 —— 样例过了不代表对了。
  另外进 DFS 前忘记 vis[sx][sy] = true 会让答案偏大（3x3 全空 12 -> 20，5x5 挡中心 1456 -> 2338），
  两个错方向相反，同时犯还可能互相掩盖。
  越界判断必须写在数组访问之前；坐标 X 是行号、Y 是列号（1 <= SX,FX <= N，1 <= SY,FY <= M）。
