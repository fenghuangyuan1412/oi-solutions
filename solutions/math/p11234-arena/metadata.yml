id: P11234
title: "[CSP-S 2024] 擂台游戏"
source: luogu
url: https://www.luogu.com.cn/problem/P11234
topics: [math/ability-bucket-dp]
difficulty: 省选（洛谷 difficulty=8）
complexity:
  time: O(D · 2^k · k)（D=不同询问数，骗分版逐询问精确 DP；性质 A 档 O(2^k) 逐询问模拟）
  space: O(n + 2^K)
status: 未本地评测（洛谷提交需登录）；官方样例 1 四行输出 5/19/7/1 逐字正确；骗分 DP 与自写枚举暴力在 100 组随机小数据 + 20 组"询问全为 2 的幂"数据上 0 不一致。本目录为骗分版，未实现正解
visualization: false
notes: >
  只讲骗分、不实现正解。地基是"能力值分桶"：a 只与轮数 R<=K<=17 比大小，bucket=min(a,K) 后
  "补充选手能力值任取"从无穷种变成 K+1 种，可对每个不同询问精确 DP（逐轮合并可能胜者 (选手,桶集合)）。
  实测档位（本机含进程启动，3 次取最小）：n,m<=8（T=256 压测）60ms；<=500 档 76ms；<=5000 档（5000 个不同 c）255ms；
  1e5 性质 A 档（pow2 快速模拟）170ms —— 测试点 1~12 约 44 分。13~15（1e5 任意 c）自造 99995 个不同询问实测
  20s 未跑出（rc=124），放弃；16~25（T=4~256）放弃。易错点全部实测：擂主 >= 写成 >（样例输出 29/29/19/29）、
  异或下标 (i-1)%4（19/20/26/19）、跨 T 组忘清 memo（5/5/5/5）、把输出写成最后一问（5/6/2/1，第一行纯属巧合）、
  补充选手桶少一位（18/19/7/1，只错一组最隐蔽）。
