<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P9748 小苹果 · 模拟 → 递推</title>
<style>
  :root { --bg:#0f1220; --card:#1a1f35; --ink:#e8ecff; --dim:#8b93b5; --acc:#5eead4; --warn:#f87171; --ok:#86efac; --fresh:#c084fc; --mid:#fbbf24; }
  * { box-sizing:border-box; }
  body { margin:0; padding:22px; background:var(--bg); color:var(--ink);
         font:15px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:12px; }
  .sub b { color:var(--ink); }
  .card { background:var(--card); border:1px solid #262c4a; border-radius:12px; padding:14px 16px; margin-bottom:12px; }
  .card h2 { font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); margin:0 0 10px; }
  button { background:#2b3358; color:var(--ink); border:1px solid #3d4778; border-radius:8px;
           padding:7px 13px; font-size:14px; cursor:pointer; margin-right:6px; }
  button:hover:not(:disabled) { background:#394373; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .topbar { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .prog { color:var(--acc); font-size:14px; margin-left:auto; font-weight:700; }
  .wrap { display:flex; gap:12px; flex-wrap:wrap; }
  .wrap > div { flex:1; min-width:320px; }
  pre.code { margin:0; font:13px/1.75 Consolas,monospace; }
  pre.code .ln { display:block; padding:0 8px; border-left:3px solid transparent; white-space:pre; }
  pre.code .ln.on { background:#173a4a; border-left-color:var(--acc); color:var(--acc); }
  .note { font-size:14px; min-height:96px; }
  .note b { color:var(--acc); } .note .bad { color:var(--warn); } .note .good { color:var(--ok); }
  .note .mid { color:var(--mid); } .note .pu { color:var(--fresh); }
  table.vars { border-collapse:collapse; width:100%; font:13px Consolas,monospace; }
  table.vars td,table.vars th { border:1px solid #2b3358; padding:4px 8px; text-align:center; }
  table.vars th { color:var(--dim); font-weight:400; }
  table.vars td.k { color:var(--dim); text-align:left; }
  table.vars td.v { color:var(--acc); font-weight:700; }
  .apple { display:inline-block; width:34px; height:34px; line-height:34px; text-align:center;
           border-radius:7px; margin:3px; font:13px Consolas,monospace; background:#2b3358; color:var(--ink);
           transition:all .25s; }
  .apple.taken { background:#5b2020; color:#fca5a5; text-decoration:line-through; }
  .apple.target { outline:2px solid var(--fresh); }
  .apple.gone { opacity:.15; }
  .row { font:14px Consolas,monospace; margin:6px 0; }
  .row .lbl { color:var(--dim); display:inline-block; width:64px; }
  .row .val { color:var(--acc); font-weight:700; }
  .row .val.hit { color:var(--warn); }
  .err { color:var(--warn); font-size:13px; }
</style>
</head>
<body>
<h1>P9748 [CSP-J 2023] 小苹果</h1>
<div class="sub">左边是<b>真的在拿苹果</b>（模拟），右边是<b>只维护两个数</b>（递推）——两条路同步走，差距一眼可见</div>

<div class="topbar">
  <button id="prev">← 上一步</button>
  <button id="next">下一步 →</button>
  <button id="play">自动播放</button>
  <button id="last">跳到结尾</button>
  <button id="reset">重置</button>
  <span class="prog" id="prog"></span>
</div>

<div class="wrap">
  <div>
    <div class="card">
      <h2>① 模拟：苹果队列（每天拿掉第 1、4、7… 个）</h2>
      <div id="queue"></div>
      <div class="row"><span class="lbl">剩余</span><span class="val" id="cntNow"></span></div>
    </div>
    <div class="card">
      <h2>② 递推：两个数就够了</h2>
      <div class="row"><span class="lbl">cnt</span><span class="val" id="rCnt"></span> <span style="color:var(--dim)">← 还剩几个苹果</span></div>
      <div class="row"><span class="lbl">days</span><span class="val" id="rDays"></span> <span style="color:var(--dim)">← 已经过了几天</span></div>
      <div class="row"><span class="lbl">pos</span><span class="val" id="rPos"></span> <span style="color:var(--dim)">← 编号 n 的苹果当前排第几</span></div>
      <div class="row"><span class="lbl">day</span><span class="val" id="rDay"></span> <span style="color:var(--dim)">← 编号 n 的苹果第几天被拿走</span></div>
    </div>
  </div>
  <div>
    <div class="card">
      <h2>讲解代码</h2>
      <pre class="code" id="code"></pre>
    </div>
    <div class="card">
      <h2>这一步在做什么</h2>
      <div class="note" id="note"></div>
    </div>
  </div>
</div>

<div class="err" id="err"></div>

<script>
const N = 8;
const CODE = [
  'long long cnt = n, days = 0;',            // 0
  'while (cnt > 0) {',                       // 1
  '    cnt -= (cnt + 2) / 3;   // 拿走 ceil(cnt/3) 个',  // 2
  '    ++days;',                             // 3
  '}',                                       // 4
  '',                                        // 5
  'long long pos = n, day = 0;',             // 6
  'while (pos > 1 && (pos - 1) % 3 != 0) {  // 还没命中就继续前移',  // 7
  '    ++day;',                              // 8
  '    pos -= (pos + 1) / 3;           // 前面被拿走 (pos+1)/3 个',  // 9
  '}',                                       // 10
  '++day;                                    // 命中那一天',        // 11
  '',                                        // 12
  'cout << days << " " << day;'              // 13
];

// 真实执行轨迹（与 solution.cpp 一致）
const STEPS = [
  { line:-1, q:[1,2,3,4,5,6,7,8], cnt:8, days:0, pos:8, day:0, taken:[],
    text:'<b>初始状态。</b>苹果 1..8 从左到右排好；<code>cnt = 8</code>（还剩 8 个）、<code>pos = 8</code>（编号 8 的苹果排在第 8 位）。<br>两个循环都还没开始。' },
  { line:2, q:[1,2,3,4,5,6,7,8], cnt:8, days:0, pos:8, day:0, taken:[0,3,6],
    text:'<b>第一问，第 1 轮：</b>被拿走的是第 1、4、7 个 ⇒ <code>ceil(8/3) = 3</code> 个。<br><code>cnt = 8 - 3 = 5</code>。<span class="mid">注意：这里只算了个数，根本没看是哪些苹果。</span>' },
  { line:1, q:[2,3,5,6,8], cnt:5, days:1, pos:8, day:0, taken:[],
    text:'模拟那边真的把 1、4、7 拿走了，剩下 <b>2 3 5 6 8</b>。<br>递推这边只更新了 <code>cnt = 5</code>。<span class="good">两边对得上。</span>' },
  { line:2, q:[2,3,5,6,8], cnt:5, days:1, pos:8, day:0, taken:[0,3],
    text:'<b>第 2 轮：</b><code>ceil(5/3) = 2</code> ⇒ <code>cnt = 5 - 2 = 3</code>。' },
  { line:1, q:[3,5,8], cnt:3, days:2, pos:8, day:0, taken:[],
    text:'模拟拿走 2、6，剩下 <b>3 5 8</b>。' },
  { line:2, q:[3,5,8], cnt:3, days:2, pos:8, day:0, taken:[0],
    text:'<b>第 3 轮：</b><code>ceil(3/3) = 1</code> ⇒ <code>cnt = 2</code>。' },
  { line:1, q:[5,8], cnt:2, days:3, pos:8, day:0, taken:[],
    text:'模拟拿走 3，剩下 <b>5 8</b>。' },
  { line:2, q:[5,8], cnt:2, days:3, pos:8, day:0, taken:[0],
    text:'<b>第 4 轮：</b><code>ceil(2/3) = 1</code> ⇒ <code>cnt = 1</code>。' },
  { line:1, q:[8], cnt:1, days:4, pos:8, day:0, taken:[],
    text:'模拟拿走 5，只剩 <b>8</b>。' },
  { line:2, q:[8], cnt:1, days:4, pos:8, day:0, taken:[0],
    text:'<b>第 5 轮：</b><code>ceil(1/3) = 1</code> ⇒ <code>cnt = 0</code>。' },
  { line:3, q:[], cnt:0, days:5, pos:8, day:0, taken:[],
    text:'<b>第一问结束：<code>days = 5</code></b>，共 5 天拿完。<br>模拟那边也确实拿空了。<span class="good">5 天 ✓</span>' },
  { line:8, q:[], cnt:0, days:5, pos:8, day:1, taken:[],
    text:'<b>第二问开始。</b><code>pos = 8, day = 0</code> ⇒ <code>++day</code> 得 <code>day = 1</code>。<br>检查 <code>(pos-1) % 3 = 7 % 3 = 1 ≠ 0</code> ⇒ <b>今天安全</b>。' },
  { line:9, q:[], cnt:0, days:5, pos:5, day:1, taken:[],
    text:'<code>pos -= (pos+1)/3 = (8+1)/3 = 3</code> ⇒ <code>pos = 5</code>。<br>含义：第 1 天它前面被拿走了 3 个苹果（第 1、4、7 个），所以它从第 8 位挪到第 5 位。' },
  { line:8, q:[], cnt:0, days:5, pos:5, day:2, taken:[],
    text:'第 2 天：<code>(5-1) % 3 = 1 ≠ 0</code> ⇒ 安全。' },
  { line:9, q:[], cnt:0, days:5, pos:3, day:2, taken:[],
    text:'<code>pos -= (5+1)/3 = 2</code> ⇒ <code>pos = 3</code>。' },
  { line:8, q:[], cnt:0, days:5, pos:3, day:3, taken:[],
    text:'第 3 天：<code>(3-1) % 3 = 2 ≠ 0</code> ⇒ 安全。' },
  { line:9, q:[], cnt:0, days:5, pos:2, day:3, taken:[],
    text:'<code>pos -= (3+1)/3 = 1</code> ⇒ <code>pos = 2</code>。' },
  { line:8, q:[], cnt:0, days:5, pos:2, day:4, taken:[],
    text:'第 4 天：<code>(2-1) % 3 = 1 ≠ 0</code> ⇒ 安全。' },
  { line:9, q:[], cnt:0, days:5, pos:1, day:4, taken:[],
    text:'<code>pos -= (2+1)/3 = 1</code> ⇒ <code>pos = 1</code>。' },
  { line:7, q:[], cnt:0, days:5, pos:1, day:5, taken:[],
    text:'第 5 天：<code>(1-1) % 3 = 0</code> ⇒ <b class="good">命中！</b><br>编号 8 的苹果正好排在第 1 位，今天被拿走。' },
  { line:13, q:[], cnt:0, days:5, pos:1, day:5, taken:[], final:true,
    text:'<b>输出 <code>5 5</code></b> —— 与官方样例一致 ✓<br><br><span class="mid">把 n 换成 1000000000 试试：天数只有 50，而模拟要开 8GB 的数组。</span>' }
];

let cur = 0, timer = null;
const $ = (id) => document.getElementById(id);

function renderCode(activeLine) {
  $('code').innerHTML = CODE.map((l, i) =>
    '<span class="ln' + (i === activeLine ? ' on' : '') + '">' +
    l.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</span>').join('');
}

function renderQueue(st) {
  const taken = new Set(st.taken || []);
  const isFinal = st.final;
  let h = '';
  const base = [1,2,3,4,5,6,7,8];
  for (let i = 0; i < base.length; ++i) {
    const v = base[i];
    const inQueue = st.q.includes(v);
    let cls = 'apple';
    if (taken.has(i)) cls += ' taken';
    if (!inQueue && !taken.has(i)) cls += ' gone';
    if (v === N) cls += ' target';
    h += '<span class="' + cls + '">' + v + '</span>';
  }
  $('queue').innerHTML = h;
  $('cntNow').textContent = st.q.length + (st.q.length ? ' 个：' + st.q.join(' ') : ' （空）');
}

function renderVars(st) {
  $('rCnt').textContent = st.cnt;
  $('rDays').textContent = st.days;
  $('rPos').textContent = st.pos;
  const hit = st.line === 11 && st.day === 5;
  $('rDay').innerHTML = '<span class="' + (hit ? 'hit' : '') + '">' + (st.day === 0 ? '—' : st.day) + '</span>';
}

function render() {
  const st = STEPS[cur];
  renderCode(st.line);
  renderQueue(st);
  renderVars(st);
  $('note').innerHTML = st.text;
  $('prog').textContent = (cur + 1) + ' / ' + STEPS.length;
  $('prev').disabled = (cur === 0);
  $('next').disabled = (cur === STEPS.length - 1);
}

function stopPlay() { if (timer) { clearInterval(timer); timer = null; $('play').textContent = '自动播放'; } }
$('prev').onclick = () => { stopPlay(); if (cur > 0) { --cur; render(); } };
$('next').onclick = () => { stopPlay(); if (cur < STEPS.length - 1) { ++cur; render(); } };
$('last').onclick = () => { stopPlay(); cur = STEPS.length - 1; render(); };
$('reset').onclick = () => { stopPlay(); cur = 0; render(); };
$('play').onclick = () => {
  if (timer) { stopPlay(); return; }
  $('play').textContent = '暂停';
  timer = setInterval(() => {
    if (cur < STEPS.length - 1) { ++cur; render(); } else stopPlay();
  }, 1200);
};

if (typeof window !== 'undefined') render();
</script>
</body>
</html>
