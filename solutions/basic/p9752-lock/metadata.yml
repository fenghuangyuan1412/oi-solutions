id: P9752
title: "[CSP-S 2023] 密码锁"
source: luogu
url: https://www.luogu.com.cn/problem/P9752
topics: [basic/enumeration]
difficulty: 普及-
complexity:
  time: O(10^5 * n * 5)   # n <= 8，上界 4e6 次判定
  space: O(n)
status: 未本地评测（洛谷提交需登录）；本地 g++ -static -O2 -std=c++14 编译，官方样例（输入 1 / "0 0 1 1 5"）实测输出 81，与题面逐字一致；用独立 JS 全枚举脚本交叉核对 3 组数据（样例 81、n=2 双拨圈反例 10、n=8 极限 1）与 C++ 正解一致；n=8 极限数据实测 6 ms（node 起子进程，含进程启动）；骗分版在官方样例上同样输出 81，在 n=2 双拨圈反例上输出 2（正解 10），证实它只覆盖特殊性质 A
visualization: true
notes: |
  唯一的坑是把"两个相邻拨圈幅度相同"这条规则写丢（漏判相邻或漏判同幅度都会多算前像，
  官方样例立刻从 81 变成 369 / 135）；其次是 dif 必须先 (s-p+10)%10 取模，
  以及"状态就是密码"（dif 全 0）必须判不合法。n=1 时答案恒为 45+36=81，是本题最便宜的一档。
