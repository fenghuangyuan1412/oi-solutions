id: P1563
title: "[NOIP 2016 提高组] 玩具谜题"
source: luogu
url: https://www.luogu.com.cn/problem/P1563
alias: NOIP2016 提高组 T1
topics: [basic/simulation, math/modular]
difficulty: 普及-
tags: [模拟, 环形取模, 规则翻译, 负数取模]
complexity:
  time: O(n + m)
  space: O(n)
status: 未本地评测（未在洛谷提交）；本机 g++ -static -O2 -std=c++14 编译无警告，官方 2 组样例全对，与"逐格走一步"参照实现随机对拍 800 组 0 不一致；8 种题意读法穷举后通过的 4 种在 20000 组随机数据上答案一致
limits: 1 <= n <= 1e5, 1 <= m <= 1e5, 1 <= si < n, 职业名字符串长度 <= 10
visualization: false
samples:
  - in: "7 3\n0 singer\n0 reader\n0 mengbier\n1 thinker\n1 archer\n0 writer\n1 mogician\n0 3\n1 1\n0 2"
    out: "writer"
  - in: "10 10\n1 C\n0 r\n0 P\n1 d\n1 e\n1 m\n1 t\n1 y\n1 u\n0 V\n1 7\n1 1\n1 4\n0 5\n0 3\n0 1\n1 6\n1 2\n0 8\n0 4"
    out: "y"
notes: 朝向取"当前所在小人"的；朝内左=顺时针(下标-1)、朝外左=逆时针(下标+1)；一次平移代替逐格循环，否则最坏 1e10 步；C++ 负数取模要 ((x%n)+n)%n
