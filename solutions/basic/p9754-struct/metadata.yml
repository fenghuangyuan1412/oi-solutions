notes: 大模拟，不考算法只考"把规格说明一字不差翻译成代码"；核心四句=先对齐 off、再记偏移、最后 off+=size、整体大小补齐到对齐整数倍。骗分价值极高：四个特殊性质各砍一块实现量（A 无操作 4、B 只有一个操作 2、C 成员全基本类型免递归、D 只有 long 对齐恒为 8），先交"操作 1/2/3"一版即可覆盖 A 档。操作 4 必须递归到基本类型，落在结构体"洞"里要输出 ERR；地址可达 1e18，必须 long long
