id: P9750
title: "[CSP-J 2023] 一元二次方程"
source: luogu
url: https://www.luogu.com.cn/problem/P9750
alias: CSP-J 2023 uqe 一元二次方程
topics: [math/number-theory, basic/output-format, basic/data-range-analysis]
difficulty: 入门~普及（洛谷难度 3）
tags: [特殊性质分档, 输出格式逐字, 完全平方判定, 根式化简, 负a翻转, 骗分60分]
complexity:
  time: O(T·sqrt(|D|))，|D|<=5e6、T<=5000
  space: O(1)
status: 未本地评测（未在洛谷提交）；本机 g++ -static -O2 -std=c++14 两版编译无警告；满分档官方 9 行样例逐字全对，对四万余个随机/定向方程（两轮 43652 / 43694）做"解析回数值 + 逐条格式规则"检查两轮均 0 错误；骗分档官方样例只对 5 行（4 个无理根行输出成整数 21/3/2/0），有理根分支与满分档逐字一致（0 条不一致），按行判对 74.4%~74.6%
limits: 1<=T<=5000, 1<=M<=10^3, |a|,|b|,|c|<=M, a!=0；测试点 1: M<=1 且 A/B/C 全"是"；2: M<=20 全"否"；3: 10^3 A+C；4: 10^3 仅 A；5: 10^3 B+C；6: 10^3 仅 B；7,8: 10^3 仅 C；9,10: 10^3 全"否"。性质A b=0、性质B c=0、性质C 有解则两根皆整数
visualization: false
files:
  solution_full.cpp: 满分档（根式化简 D=s^2·r + 题面 5 条输出规则逐条实现）
  solution.cpp: 骗分档（只做 NO 判定 + 完全平方走整数分数；无理根用 double 蒙，注释已标明"是骗不是分"）
  verify.js: Node 验算脚本（独立格式检查器 + 数值回代 + 骗分档统计），仅用于验证，非讲解代码
samples:
  - in: "9 1000\n1 -1 0\n-1 -1 -1\n1 -2 1\n1 5 4\n4 4 1\n1 0 -432\n1 -3 1\n2 -4 1\n1 7 1"
    out: "1\nNO\n1\n-1\n-1/2\n12*sqrt(3)\n3/2+sqrt(5)/2\n1+sqrt(2)/2\n-7/2+3*sqrt(5)/2"
notes: |
  骗分依据（可推算）：性质 B(c=0) ⇒ Δ=b^2 必为完全平方；性质 C(两根皆整数) ⇒ Δ=a^2(r1-r2)^2 必为完全平方；
  所以只写有理分支能稳过测试点 1、3、5、6、7、8 ≈ 60 分（未在洛谷实测，只是分档表推算）。
  性质 A(b=0) 是陷阱：实测 20 万组随机 b=0、|a|,|c|<=1000 的方程里 Δ<0 占 49.8%、有理根仅 0.2%、无理根 49.9%。
  满分最难的一点：a<0 时较大根要取 (-b-sqrt(D))/(2a)，代码统一写成 q1 + q2*sqrt(r) 且 q2 = s/(2|a|) > 0。
  完全平方判定不能直接信 sqrt：先 sqrt 猜值再用两个 while 修成 floor(sqrt(D))。
  格式五条规则要逐条实现：q1=0 跳过、q2=1 写 sqrt(r)、q2 整数写 {q2}*sqrt(r)、1/q2 整数写 sqrt(r)/{q3}、一般写 {c}*sqrt(r)/{d}；行内不得有空格。
