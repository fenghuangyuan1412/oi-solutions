<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P11227 扑克牌 · 去重点亮 52 格</title>
<style>
  :root { --bg:#0f1220; --card:#1a1f35; --ink:#e8ecff; --dim:#8b93b5; --acc:#5eead4; --warn:#f87171; --ok:#86efac; --fresh:#c084fc; --mid:#fbbf24; }
  * { box-sizing:border-box; }
  body { margin:0; padding:22px; background:var(--bg); color:var(--ink);
         font:15px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:12px; }
  .sub b { color:var(--ink); }
  .card { background:var(--card); border:1px solid #262c4a; border-radius:12px; padding:14px 16px; margin-bottom:12px; }
  .card h2 { font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); margin:0 0 10px; }
  button { background:#2b3358; color:var(--ink); border:1px solid #3d4778; border-radius:8px;
           padding:7px 13px; font-size:14px; cursor:pointer; margin-right:6px; }
  button:hover:not(:disabled) { background:#394373; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .topbar { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .prog { color:var(--acc); font-size:14px; margin-left:auto; font-weight:700; }
  .wrap { display:flex; gap:12px; flex-wrap:wrap; }
  .wrap > div { flex:1; min-width:340px; }
  pre.code { margin:0; font:13px/1.75 Consolas,monospace; }
  pre.code .ln { display:block; padding:0 8px; border-left:3px solid transparent; white-space:pre; }
  pre.code .ln.on { background:#173a4a; border-left-color:var(--acc); color:var(--acc); }
  .note { font-size:14px; min-height:96px; }
  .note b { color:var(--acc); } .note .bad { color:var(--warn); } .note .good { color:var(--ok); }
  .note .mid { color:var(--mid); } .note .pu { color:var(--fresh); }
  .grid { display:grid; grid-template-columns:34px repeat(13,1fr); gap:3px; }
  .hd { text-align:center; font:11px Consolas,monospace; color:var(--dim); padding:2px 0; }
  .suit { text-align:center; font:12px Consolas,monospace; color:var(--dim); display:flex; align-items:center; justify-content:center; }
  .cell { height:30px; border-radius:5px; background:#232a4a; border:1px solid #333c66;
          display:flex; align-items:center; justify-content:center; font:12px Consolas,monospace; color:#5a6389; }
  .cell.lit { background:#1c3b2a; border-color:var(--ok); color:var(--ok); }
  .cell.cur { background:#173a4a; border-color:var(--acc); color:var(--acc); box-shadow:0 0 0 2px var(--acc); }
  .cell.dup { border-color:var(--warn); color:var(--warn); box-shadow:0 0 0 2px var(--warn); }
  .row { font:14px Consolas,monospace; margin:6px 0; }
  .row .lbl { color:var(--dim); display:inline-block; width:130px; }
  .row .val { color:var(--acc); font-weight:700; }
  .ans { margin-top:10px; text-align:center; font:15px Consolas,monospace; color:var(--dim); }
  .ans b { color:var(--ok); font-size:22px; }
  .barwrap { height:12px; background:#232a4a; border-radius:6px; overflow:hidden; margin-top:4px; }
  .bar { height:100%; background:linear-gradient(90deg,#5eead4,#86efac); width:0; transition:width .35s; }
  .err { color:var(--warn); font-size:13px; }
</style>
</head>
<body>
<h1>P11227 [CSP-J 2024] 扑克牌</h1>
<div class="sub">答案只看<b>出现过几种不同牌</b>：把 <b>4×13=52</b> 个格子逐个点亮，重复牌不再加，缺几种就借几张。数据取自官方样例 2（<b>DQ H3 DQ DT</b>）。</div>

<div class="topbar">
  <button id="prev">← 上一步</button>
  <button id="next">下一步 →</button>
  <button id="play">自动播放</button>
  <button id="last">跳到结尾</button>
  <button id="reset">重置</button>
  <span class="prog" id="prog"></span>
</div>

<div class="wrap">
  <div>
    <div class="card">
      <h2>牌池 seen[花色][点数]（行=花色 D/C/H/S，列=点数 A2..9TJQK）</h2>
      <div class="grid" id="grid"></div>
      <div class="row" style="margin-top:12px"><span class="lbl">当前读入</span><span class="val" id="vcur"></span></div>
      <div class="row"><span class="lbl">不同牌种 cnt</span><span class="val" id="vcnt"></span></div>
      <div class="barwrap"><div class="bar" id="bar"></div></div>
      <div class="ans" id="ansline"></div>
    </div>
  </div>
  <div>
    <div class="card">
      <h2>讲解代码</h2>
      <pre class="code" id="code"></pre>
    </div>
    <div class="card">
      <h2>这一步在做什么</h2>
      <div class="note" id="note"></div>
    </div>
  </div>
</div>

<div class="err" id="err"></div>

<script>
const SUITS = ['D','C','H','S'];
const RANKS = 'A23456789TJQK';
function cellIdx(suit, rank){ return SUITS.indexOf(suit) * 13 + RANKS.indexOf(rank); }
const DQ = cellIdx('D','Q'), H3 = cellIdx('H','3'), DT = cellIdx('D','T');

const CODE = [
  'bool seen[4][13] = {};',                                // 0
  'for (int i = 0; i < n; ++i) {',                          // 1
  '    string s; cin >> s;',                                // 2
  '    int a = suit[s[0]], b = rank[s[1]];',                // 3
  '    seen[a][b] = true;',                                 // 4
  '}',                                                      // 5
  'int cnt = 0;',                                           // 6
  'for (a,b) if (seen[a][b]) ++cnt;   // 数亮格',            // 7
  'cout << 52 - cnt << "\\n";'                              // 8
];

// 每步：line 高亮行 / cur 当前牌 / lit 已亮集合 / hi 当前目标格 / dup 重复标记 / cnt / final
const STEPS = [
  { line:0, cur:'—', lit:[], cnt:0, text:'初始：`seen[4][13]` 全 <code>false</code>，52 个格子都是暗的。<br><code>cnt = 0</code>。' },
  { line:2, cur:'DQ', lit:[], hi:DQ, cnt:0, text:'<b>读入第 1 张牌 <code>DQ</code></b>（方片 Q）。<br>下一步把它对应的格子点亮。' },
  { line:4, cur:'DQ', lit:[DQ], hi:DQ, cnt:1, text:'<code>seen[D][Q] = true</code>，这是<b>新牌种</b>。<br><span class="good">点亮 1 格 ⇒ cnt = 1。</span>' },
  { line:2, cur:'H3', lit:[DQ], hi:H3, cnt:1, text:'<b>读入第 2 张牌 <code>H3</code></b>（红桃 3）。' },
  { line:4, cur:'H3', lit:[DQ,H3], hi:H3, cnt:2, text:'<code>seen[H][3] = true</code>，又是新牌种。<br>cnt = 2。' },
  { line:2, cur:'DQ', lit:[DQ,H3], hi:DQ, cnt:2, text:'<b>读入第 3 张牌 <code>DQ</code></b>——和第 1 张一模一样。' },
  { line:4, cur:'DQ', lit:[DQ,H3], hi:DQ, dup:DQ, cnt:2, text:'<span class="bad">格子 <code>seen[D][Q]</code> 本来就亮着，再置 true 不改变任何东西。</span><br><b>重复牌不加分 ⇒ cnt 仍是 2。</b>这就是不能直接 <code>52−n</code> 的原因。' },
  { line:2, cur:'DT', lit:[DQ,H3], hi:DT, cnt:2, text:'<b>读入第 4 张牌 <code>DT</code></b>（方片 10，题面记作 <code>T</code>）。' },
  { line:4, cur:'DT', lit:[DQ,H3,DT], hi:DT, cnt:3, text:'<code>seen[D][T] = true</code>，新牌种。<br>cnt = 3。全部读完了。' },
  { line:7, cur:'—', lit:[DQ,H3,DT], cnt:3, text:'<b>数亮格</b>：遍历 <code>seen</code>，共有 <b>3</b> 个 true ⇒ <code>cnt = 3</code>。<br>手里出现过 3 种不同的牌。' },
  { line:8, cur:'—', lit:[DQ,H3,DT], cnt:3, final:true, text:'输出 <code>52 − cnt = 52 − 3 = </code><b>49</b>。<br><br>缺的 49 种各借 1 张就凑齐一副完整牌 ⇒ <span class="good">与官方样例一致 ✓</span>' }
];

let cur = 0, timer = null;
const $ = (id) => document.getElementById(id);

function renderCode(line){
  $('code').innerHTML = CODE.map((l,i)=>
    '<span class="ln'+(i===line?' on':'')+'">'+l.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</span>').join('');
}

function renderGrid(st){
  let h = '<div class="hd"></div>';
  for (let c=0;c<13;c++) h += '<div class="hd">'+RANKS[c]+'</div>';
  for (let r=0;r<4;r++){
    h += '<div class="suit">'+SUITS[r]+'</div>';
    for (let c=0;c<13;c++){
      const idx = r*13+c;
      let cls = 'cell';
      if (st.lit.indexOf(idx) >= 0) cls += ' lit';
      if (st.dup === idx) cls += ' dup';
      else if (st.hi === idx) cls += ' cur';
      h += '<div class="'+cls+'">'+RANKS[c]+'</div>';
    }
  }
  $('grid').innerHTML = h;
}

function render(){
  const st = STEPS[cur];
  renderCode(st.line);
  renderGrid(st);
  $('vcur').textContent = st.cur;
  $('vcnt').textContent = st.cnt + ' / 52';
  $('bar').style.width = (st.cnt / 52 * 100) + '%';
  $('ansline').innerHTML = st.final ? '最少再借 <b>49</b> 张 <span style="color:var(--ok)">✓</span>'
    : '（还差 '+(52-st.cnt)+' 种没点亮）';
  $('note').innerHTML = st.text.replace(/`([^`]+)`/g,'<code>$1</code>');
  $('prog').textContent = (cur+1)+' / '+STEPS.length;
  $('prev').disabled = (cur===0);
  $('next').disabled = (cur===STEPS.length-1);
}

function stopPlay(){ if(timer){clearInterval(timer);timer=null;$('play').textContent='自动播放';} }
$('prev').onclick = () => { stopPlay(); if(cur>0){--cur;render();} };
$('next').onclick = () => { stopPlay(); if(cur<STEPS.length-1){++cur;render();} };
$('last').onclick = () => { stopPlay(); cur=STEPS.length-1; render(); };
$('reset').onclick = () => { stopPlay(); cur=0; render(); };
$('play').onclick = () => {
  if(timer){stopPlay();return;}
  $('play').textContent='暂停';
  timer=setInterval(()=>{ if(cur<STEPS.length-1){++cur;render();} else stopPlay(); },1200);
};

if (typeof window !== 'undefined') render();
</script>
</body>
</html>
