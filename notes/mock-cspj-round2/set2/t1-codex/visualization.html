<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T1 角色图鉴 · 标记数组去重分步演示</title>
<style>
  :root { --bg:#0f1220; --card:#1a1f35; --ink:#e8ecff; --dim:#8b93b5; --acc:#5eead4; --warn:#f87171; --ok:#86efac; }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px; background:var(--bg); color:var(--ink);
         font:15px/1.6 "Segoe UI",system-ui,-apple-system,sans-serif; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:20px; }
  .card { background:var(--card); border:1px solid #262c4a; border-radius:12px; padding:16px 18px; margin-bottom:16px; }
  .card h2 { font-size:13px; letter-spacing:.08em; color:var(--dim); margin:0 0 12px; }
  button { background:#2b3358; color:var(--ink); border:1px solid #3d4778; border-radius:8px;
           padding:8px 14px; font-size:14px; cursor:pointer; margin-right:8px; }
  button:hover:not(:disabled) { background:#394373; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  textarea { background:#0d1020; color:var(--ink); border:1px solid #3d4778; border-radius:8px;
             padding:8px 10px; font:13px/1.5 Consolas,monospace; width:340px; height:64px; resize:vertical; }
  .chars { display:flex; flex-wrap:wrap; gap:6px; }
  .ch { width:38px; height:44px; display:flex; flex-direction:column; align-items:center; justify-content:center;
        border-radius:7px; background:#232a4a; border:1px solid #333c66; font:16px Consolas,monospace; }
  .ch.fresh { border-color:#4b5aa8; }
  .ch.dup { color:#6b7396; background:#171b2e; }
  .ch.active { outline:2px solid var(--acc); outline-offset:1px; transform:translateY(-3px); }
  .ch .k { font-size:9px; color:var(--dim); margin-top:2px; }
  .grid { display:flex; flex-wrap:wrap; gap:3px; max-height:170px; overflow:auto; }
  .cell { width:20px; height:20px; border-radius:4px; background:#1b2140; border:1px solid #2c3560;
          font:9px/18px Consolas,monospace; text-align:center; color:#5a6288; }
  .cell.on { background:linear-gradient(180deg,var(--acc),#0891b2); color:#04121a; border-color:#0891b2; font-weight:700; }
  .cell.flash { outline:2px solid var(--warn); outline-offset:1px; }
  .stack { display:flex; height:30px; border-radius:7px; overflow:hidden; background:#0d1020; }
  .stack .own { background:linear-gradient(90deg,var(--acc),#0891b2); color:#04121a; font-weight:700;
                display:flex; align-items:center; justify-content:center; font-size:13px; transition:width .25s ease; }
  .stack .lack { background:#4a2331; color:#fca5a5; display:flex; align-items:center; justify-content:center;
                 font-size:13px; transition:width .25s ease; }
  .legend { color:var(--dim); font-size:12px; margin-top:6px; }
  .out { font:26px/1.3 Consolas,monospace; min-height:36px; }
  .out .new { color:var(--acc); }
  .note { color:var(--dim); font-size:14px; min-height:60px; }
  .note b { color:var(--ink); }
  .tag { display:inline-block; padding:1px 8px; border-radius:20px; font-size:12px; margin-right:6px; }
  .tag.fresh { background:#173a4a; color:var(--ok); }
  .tag.dup { background:#4a1c1c; color:var(--warn); }
  table.vars { border-collapse:collapse; width:100%; font:13px Consolas,monospace; }
  table.vars td, table.vars th { border:1px solid #2c3560; padding:5px 8px; text-align:left; }
  table.vars th { color:var(--dim); font-weight:400; background:#141830; }
  table.vars td.hot { color:var(--acc); font-weight:700; }
  pre.code { margin:0; font:13px/1.65 Consolas,monospace; color:#c3cbee; overflow-x:auto; }
  pre.code .ln { display:block; padding:0 8px; border-radius:4px; white-space:pre; color:#7d86ab; }
  pre.code .ln.run { background:#173a4a; color:var(--acc); }
  .row { display:flex; gap:16px; flex-wrap:wrap; }
  .row > div { flex:1; min-width:300px; }
  .prog { color:var(--dim); font-size:13px; margin-left:auto; }
  .topbar { display:flex; align-items:flex-start; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .err { color:var(--warn); font-size:13px; }
</style>
</head>
<body>
<h1>T1 角色图鉴 / codex —— 标记数组去重</h1>
<div class="sub">CSP-J 第二轮模拟卷第 2 套 · 对齐 CSP-J 2024 T1 扑克牌 P11227 · 只有第一次抽到才点亮图鉴</div>

<div class="topbar">
  <textarea id="src">5 8
1 2 2 3 1</textarea>
  <div>
    <div>
      <button id="load">载入样例 / 重新生成</button>
    </div>
    <div style="margin-top:8px">
      <button id="prev">◀ 上一步</button>
      <button id="next">下一步 ▶</button>
      <button id="play">▶ 自动播放</button>
      <button id="jump">跳到末尾</button>
    </div>
    <div class="err" id="err"></div>
  </div>
  <span class="prog" id="prog"></span>
</div>

<div class="card"><h2>① 抽卡序列 c[1..n]（框住的是当前这一步）</h2>
  <div class="chars" id="chars"></div>
</div>

<div class="card"><h2>② 图鉴 have[1..m]：绿 = 已拥有，暗 = 还没抽到</h2>
  <div class="grid" id="grid"></div>
  <div class="legend" id="gridinfo"></div>
</div>

<div class="row">
  <div class="card"><h2>③ 已拥有 vs 还缺（共 m 格）</h2>
    <div class="stack" id="stack"></div>
    <div class="legend">左：distinct（已点亮的种类数）　右：m − distinct（还要抽的次数 = 答案）</div>
  </div>
  <div class="card" style="flex:1.4"><h2>讲解</h2>
    <div class="note" id="note"></div>
    <div class="out" id="out"></div>
  </div>
</div>

<div class="row">
  <div class="card"><h2>④ 变量状态表</h2>
    <table class="vars" id="vars"></table>
  </div>
  <div class="card" style="flex:1.2"><h2>⑤ 代码行高亮（solution.cpp 核心）</h2>
    <pre class="code" id="code"></pre>
  </div>
</div>

<script>
const CODE = [
  'bool have[M];                 // 全局，自动全 false',
  'int distinct = 0;',
  'for (int i = 1; i <= n; i++) {',
  '    int c;',
  '    scanf("%d", &c);',
  '    if (!have[c]) {           // 只有第一次见到才计数',
  '        have[c] = true;',
  '        distinct++;',
  '    }',
  '}',
  'printf("%d\\n", m - distinct);'
];
let N = 0, MM = 0, C = [], steps = [], t = 0, timer = null;

function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

function build() {
  steps = [{ kind:'init', cnt:0, have:new Array(MM+1).fill(false) }];
  const have = new Array(MM+1).fill(false);
  let distinct = 0;
  for (let i = 0; i < N; i++) {
    const c = C[i];
    const fresh = !have[c];
    if (fresh) { have[c] = true; distinct++; }
    steps.push({ kind:'scan', i, c, fresh, cnt:distinct, have:[...have] });
  }
  steps.push({ kind:'done', cnt:distinct, have:[...have], ans:MM - distinct });
}

function lineOf(st) {
  if (st.kind === 'init') return 0;
  if (st.kind === 'done') return 10;
  return st.fresh ? 5 : 4;
}

function render() {
  const st = steps[t];

  // ① 抽卡序列
  const cb = document.getElementById('chars'); cb.innerHTML = '';
  for (let i = 0; i < N; i++) {
    const seen = (st.kind === 'done') ? true : (st.kind === 'scan' ? st.have[C[i]] : false);
    let cls = 'ch ' + (seen ? 'fresh' : 'dup');
    if (st.kind === 'scan' && st.i === i) cls += ' active';
    const box = el('div', cls);
    box.appendChild(el('span', null, C[i]));
    box.appendChild(el('span', 'k', st.kind === 'scan' && st.i === i ? (st.fresh ? '第一次' : '复数') : (seen ? '已拥有' : '—')));
    cb.appendChild(box);
  }

  // ② 图鉴格子
  const gb = document.getElementById('grid'); gb.innerHTML = '';
  const showM = Math.min(MM, 240);
  for (let x = 1; x <= showM; x++) {
    const on = st.have[x] === true;
    const flash = st.kind === 'scan' && st.fresh && st.c === x;
    gb.appendChild(el('div', 'cell' + (on ? ' on' : '') + (flash ? ' flash' : ''), x));
  }
  document.getElementById('gridinfo').textContent =
    MM > showM ? `m = ${MM} 太大，只画前 ${showM} 格；统计仍按全部 ${MM} 格进行。` : `m = ${MM}，每格对应 have[编号]。`;

  // ③ 已拥有 / 还缺
  const distinct = st.cnt, lack = MM - distinct;
  const sk = document.getElementById('stack'); sk.innerHTML = '';
  const pw = MM > 0 ? distinct / MM * 100 : 0, lw = MM > 0 ? lack / MM * 100 : 0;
  const own = el('div', 'own', distinct > 0 ? distinct + ' 种' : '');
  own.style.width = pw + '%';
  sk.appendChild(own);
  const lac = el('div', 'lack', lack > 0 ? lack + ' 种' : '');
  lac.style.width = lw + '%';
  sk.appendChild(lac);

  // ④ 变量状态表
  const vt = document.getElementById('vars'); vt.innerHTML = '';
  const head = el('tr'); ['变量', '当前值', '含义'].forEach(x => head.appendChild(el('th', null, x)));
  vt.appendChild(head);
  const rows = [
    ['n', N, '抽卡总次数', false],
    ['m', MM, '图鉴角色总数', false],
    ['i', st.kind === 'scan' ? st.i + 1 : (st.kind === 'done' ? N : 0), '正在读第几次', st.kind === 'scan'],
    ['c', st.kind === 'scan' ? st.c : '—', '这次抽到的角色编号', st.kind === 'scan'],
    ['have[c]', st.kind === 'scan' ? (st.fresh ? 'false → true' : 'true（不变）') : '—', '之前是否已拥有', st.kind === 'scan' && st.fresh],
    ['distinct', distinct, '已点亮的种类数', true],
    ['m - distinct', lack, '还缺的种类数 = 答案', st.kind === 'done']
  ];
  rows.forEach(([k, v, mean, hot]) => {
    const tr = el('tr');
    tr.appendChild(el('td', null, k));
    tr.appendChild(el('td', hot ? 'hot' : null, v));
    tr.appendChild(el('td', null, mean));
    vt.appendChild(tr);
  });

  // ⑤ 代码高亮
  const cp = document.getElementById('code'); cp.innerHTML = '';
  const run = lineOf(st);
  CODE.forEach((line, idx) => {
    cp.appendChild(el('span', 'ln' + (idx === run ? ' run' : ''), (idx + 1) + '  ' + line));
  });

  // 讲解
  const note = document.getElementById('note'), out = document.getElementById('out'), prog = document.getElementById('prog');
  if (st.kind === 'init')
    note.innerHTML = `输入 <b>n = ${N}</b>，<b>m = ${MM}</b>，抽卡序列 <b>${C.join(' ')}</b>。目标：算出图鉴还缺几种角色。运气假设最好，所以"缺几种"就是"还要抽几次"。`;
  else if (st.kind === 'scan') {
    note.innerHTML = st.fresh
      ? `第 <b>${st.i + 1}</b> 次抽到角色 <b>${st.c}</b>：${el('span', 'tag fresh', '第一次').outerHTML}<b>have[${st.c}]</b> 本来是 <b>false</b>，把它改成 <b>true</b>（点亮图鉴），<b>distinct</b> 从 ${st.cnt - 1} 变成 <b>${st.cnt}</b>。`
      : `第 <b>${st.i + 1}</b> 次又抽到角色 <b>${st.c}</b>：${el('span', 'tag dup', '复数').outerHTML}<b>have[${st.c}]</b> 早就是 <b>true</b>，什么都不做，<b>distinct</b> 仍是 <b>${st.cnt}</b>。这就是去重的关键一步。`;
  } else {
    note.innerHTML = `全部 ${N} 次读完：一共点亮 <b>${st.cnt}</b> 种，还缺 <b>${MM} - ${st.cnt} = ${st.ans}</b> 种。` +
      `每次抽卡最多只能补一种，所以至少还要抽 ${st.ans} 次；运气好时 ${st.ans} 次刚好补齐，答案就是它。`;
    out.innerHTML = '答案：<span class="new">' + st.ans + '</span>';
  }
  if (st.kind !== 'done') out.innerHTML = '';
  prog.textContent = `步骤 ${t + 1} / ${steps.length}`;
  document.getElementById('prev').disabled = t === 0;
  document.getElementById('next').disabled = t === steps.length - 1;
}

function parse() {
  const err = document.getElementById('err'); err.textContent = '';
  const lines = document.getElementById('src').value.replace(/\r/g, '').split('\n');
  const first = (lines[0] || '').trim().split(/\s+/).map(Number);
  const rest = (lines.slice(1).join(' ')).trim().split(/\s+/).filter(x => x.length).map(Number);
  if (first.length < 2 || !isFinite(first[0]) || !isFinite(first[1])) { err.textContent = '第一行需要两个整数 n m'; return false; }
  N = Math.floor(first[0]); MM = Math.floor(first[1]);
  if (N < 1 || N > 2000) { err.textContent = '演示用 1 ≤ n ≤ 2000'; return false; }
  if (MM < 1 || MM > 5000) { err.textContent = '演示用 1 ≤ m ≤ 5000'; return false; }
  if (rest.length < N) { err.textContent = `第二行只给了 ${rest.length} 个数，需要 ${N} 个`; return false; }
  C = rest.slice(0, N).map(x => {
    let v = Math.floor(x);
    if (!isFinite(v) || v < 1) v = 1;
    if (v > MM) v = MM;
    return v;
  });
  return true;
}

function load() {
  if (!parse()) return;
  if (timer) { clearInterval(timer); timer = null; document.getElementById('play').textContent = '▶ 自动播放'; }
  t = 0; build(); render();
}

document.getElementById('next').onclick = () => { if (t < steps.length - 1) { t++; render(); } };
document.getElementById('prev').onclick = () => { if (t > 0) { t--; render(); } };
document.getElementById('load').onclick = load;
document.getElementById('jump').onclick = () => { t = steps.length - 1; render(); };
document.getElementById('play').onclick = e => {
  if (timer) { clearInterval(timer); timer = null; e.target.textContent = '▶ 自动播放'; return; }
  e.target.textContent = '⏸ 暂停';
  timer = setInterval(() => {
    if (t >= steps.length - 1) { clearInterval(timer); timer = null; e.target.textContent = '▶ 自动播放'; return; }
    t++; render();
  }, 380);
};

load();
</script>
</body>
</html>
