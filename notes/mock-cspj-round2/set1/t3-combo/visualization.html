<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T3 深渊连击 · 尺取与最早结束贪心</title>
<style>
  :root { --bg:#0f1220; --card:#1a1f35; --ink:#e8ecff; --dim:#8b93b5; --acc:#5eead4; --warn:#f87171; --ok:#86efac; --gold:#fbbf24; }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px; background:var(--bg); color:var(--ink);
         font:15px/1.6 "Segoe UI",system-ui,-apple-system,"Microsoft YaHei",sans-serif; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:18px; }
  .card { background:var(--card); border:1px solid #262c4a; border-radius:12px; padding:14px 16px; margin-bottom:16px; }
  .card h2 { font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); margin:0 0 12px; }
  button { background:#2b3358; color:var(--ink); border:1px solid #3d4778; border-radius:8px;
           padding:7px 13px; font-size:14px; cursor:pointer; margin-right:6px; }
  button:hover:not(:disabled) { background:#394373; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  input { background:#0d1020; color:var(--ink); border:1px solid #3d4778; border-radius:8px;
          padding:7px 9px; font:14px/1.4 Consolas,monospace; }
  #hdr { width:130px; } #src { width:420px; }
  .topbar { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .prog { color:var(--dim); font-size:13px; margin-left:auto; }
  label { color:var(--dim); font-size:13px; }
  .bars { display:flex; align-items:flex-end; gap:8px; min-height:150px; }
  .col { flex:1; max-width:64px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:150px; }
  .bar { width:100%; background:#2b3358; border-radius:5px 5px 0 0; transition:height .2s ease, background .2s; min-height:4px; }
  .col.win .bar { background:linear-gradient(180deg,var(--acc),#0891b2); }
  .col.done .bar { background:linear-gradient(180deg,var(--ok),#15803d); }
  .col.over .bar { background:linear-gradient(180deg,var(--warn),#b91c1c); }
  .col .v { font:13px Consolas,monospace; margin-bottom:3px; }
  .col .i { font-size:11px; color:var(--dim); margin-top:4px; }
  .col.cur .i { color:var(--acc); font-weight:700; }
  .col.cur .bar { outline:2px solid var(--gold); outline-offset:1px; }
  .gauge { height:22px; background:#0d1020; border:1px solid #3d4778; border-radius:11px; position:relative; overflow:hidden; }
  .gauge .fill { position:absolute; left:0; top:0; bottom:0; background:linear-gradient(90deg,#0891b2,var(--acc)); transition:width .2s; }
  .gauge .fill.over { background:linear-gradient(90deg,#b91c1c,var(--warn)); }
  .gauge .fill.hit { background:linear-gradient(90deg,#15803d,var(--ok)); }
  .gauge .lab { position:absolute; right:8px; top:0; line-height:22px; font:12px Consolas,monospace; color:var(--dim); }
  .row { display:flex; gap:16px; flex-wrap:wrap; }
  .row > div { flex:1; min-width:300px; }
  table.vars { border-collapse:collapse; width:100%; font:13px Consolas,monospace; }
  table.vars td { border-bottom:1px solid #222743; padding:3px 6px; text-align:right; }
  table.vars td:first-child { text-align:left; color:var(--dim); }
  td.hot { color:var(--acc); font-weight:700; }
  .segs { display:flex; flex-wrap:wrap; gap:6px; }
  .sg { padding:3px 9px; border-radius:8px; background:#143a22; border:1px solid #2c6b40; color:var(--ok); font:13px Consolas,monospace; }
  .note { color:var(--dim); font-size:14px; min-height:56px; }
  .note b { color:var(--ink); }
  .phase { display:inline-block; padding:1px 9px; border-radius:20px; font-size:12px; margin-right:6px;
           background:#173a4a; color:var(--ok); }
  pre { margin:0; font:12.5px/1.7 Consolas,monospace; overflow-x:auto; }
  .ln { display:block; padding:0 8px; border-radius:4px; white-space:pre; }
  .ln.cur { background:#242c52; color:var(--acc); }
  .kw { color:#7dd3fc; } .cm { color:#5f7a91; } .st { color:#fbbf24; } .fn { color:#c4b5fd; }
</style>
</head>
<body>
<h1>T3 深渊连击 / combo · 尺取 + 最早结束贪心</h1>
<div class="sub">CSP-J 第二轮模拟卷 第 1 套 T3（对齐真题 CSP-J 2025 T3 异或和 P14359 的"前缀和 + 计数"考点）。血量全为正 ⇒ 窗口和单调 ⇒ 双指针只前进；一旦等于 k 立刻收割。</div>

<div class="topbar">
  <label>n 与 k</label><input type="text" id="hdr" value="6 5">
  <label>a（正整数）</label><input type="text" id="src" value="2 3 1 4 2 3">
  <button id="load">载入</button>
  <button data-s="6 5|2 3 1 4 2 3">样例1</button>
  <button data-s="3 7|3 3 3">样例2</button>
  <button data-s="8 3|1 2 1 2 1 1 1 3">样例3</button>
  <button data-s="3 3|1 2 1">重叠陷阱</button>
</div>
<div class="topbar">
  <button id="prev">◀ 上一步</button>
  <button id="next">下一步 ▶</button>
  <button id="play">▶ 自动播放</button>
  <button id="jump">跳到末尾</button>
  <span class="prog" id="prog"></span>
</div>

<div class="card"><h2>① 怪物血量与当前窗口 [l, r]</h2>
  <div class="bars" id="bars"></div>
</div>

<div class="row">
  <div class="card"><h2>② 窗口和 sum 对比 k</h2>
    <div class="gauge"><div class="fill" id="fill"></div><div class="lab" id="glab"></div></div>
    <div class="note" id="note"></div>
    <h2 style="margin-top:14px">已收割的连击</h2>
    <div class="segs" id="segs"></div>
  </div>
  <div class="card"><h2>③ 变量状态表</h2>
    <table class="vars" id="vars"></table>
  </div>
</div>

<div class="card"><h2>④ 代码与执行位置</h2>
  <pre id="code"></pre>
</div>

<script>
const CODE = [
  'long long ans = 0, sum = 0;',
  'int l = 1;',
  'for (int r = 1; r <= n; r++) {',
  '    sum += a[r];                                   // 右端点扩一格',
  '    while (l <= r && sum > k) { sum -= a[l]; l++; } // 太大就缩左端点（全正才敢）',
  '    if (sum == k) {                                // 以 r 结尾的合法段唯一',
  '        ans++;                                     // 最早结束 → 立刻收割',
  '        sum = 0;',
  '        l = r + 1;                                 // r 之前的怪物全部作废',
  '    }',
  '}',
  'printf("%lld\\n", ans);'
];

let n = 0, k = 5, A = [], steps = [], t = 0, timer = null;

function build() {
  steps = [{ kind:'init', line:0, r:0, l:1, sum:0, ans:0, segs:[], win:[] }];
  let l = 1; const ans = []; const segs = [];
  let sum = 0;
  for (let r = 1; r <= n; r++) {
    sum += A[r - 1];
    steps.push({ kind:'add', line:2, r, l, sum, ans:ans.length, segs:segs.slice(), win:range(l, r) });
    while (l <= r && sum > k) {
      sum -= A[l - 1]; l++;
      steps.push({ kind:'shrink', line:4, r, l, sum, ans:ans.length, segs:segs.slice(), win:(l <= r ? range(l, r) : []) });
    }
    if (sum === k) {
      ans.push([l, r]); segs.push(`[${l},${r}]`);
      steps.push({ kind:'hit', line:6, r, l, sum, ans:ans.length, segs:segs.slice(), win:range(l, r), seg:[l, r] });
      sum = 0; l = r + 1;
      steps.push({ kind:'reset', line:8, r, l, sum:0, ans:ans.length, segs:segs.slice(), win:[] });
    }
  }
  steps.push({ kind:'done', line:11, r:n, l, sum, ans:ans.length, segs:segs.slice(), win:[] });
}
function range(a, b) { const r = []; for (let i = a; i <= b; i++) r.push(i); return r; }

function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

function hi(line) {
  let h = line.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const c = h.indexOf('//');
  let head = h, tail = '';
  if (c >= 0) { head = h.slice(0, c); tail = '<span class="cm">' + h.slice(c) + '</span>'; }
  head = head.replace(/"[^"]*"/g, s => '<span class="st">' + s + '</span>')
             .replace(/\b(int|long|for|while|if|printf|char|return)\b/g, '<span class="kw">$1</span>')
             .replace(/\b(ans|sum|l|r|k|a)\b/g, '<span class="fn">$1</span>');
  return head + tail;
}

function render() {
  const st = steps[t];
  const harvested = new Set();
  st.segs.forEach(s => { const mm = s.match(/\[(\d+),(\d+)\]/); if (mm) for (let i = +mm[1]; i <= +mm[2]; i++) harvested.add(i); });
  const bb = document.getElementById('bars'); bb.innerHTML = '';
  const maxv = Math.max(1, ...A);
  for (let i = 1; i <= n; i++) {
    const inWin = st.win.includes(i);
    const cls = 'col' + (harvested.has(i) ? ' done' : (inWin ? (st.sum > k ? ' over' : ' win') : '')) +
                ((st.kind === 'add' || st.kind === 'shrink' || st.kind === 'hit') && st.r === i ? ' cur' : '');
    const col = el('div', cls);
    col.appendChild(el('div', 'v', A[i - 1]));
    const bar = el('div', 'bar'); bar.style.height = (A[i - 1] / maxv * 96) + 'px';
    col.appendChild(bar); col.appendChild(el('div', 'i', i));
    bb.appendChild(col);
  }

  const fill = document.getElementById('fill');
  const ratio = Math.min(1.0, st.sum / Math.max(1, k));
  fill.style.width = (ratio * 100) + '%';
  fill.className = 'fill' + (st.sum > k ? ' over' : (st.sum === k ? ' hit' : ''));
  document.getElementById('glab').textContent = `sum = ${st.sum}   k = ${k}`;

  const vt = document.getElementById('vars'); vt.innerHTML = '';
  const row = (a, b, hot) => { const tr = el('tr'); tr.appendChild(el('td', null, a)); tr.appendChild(el('td', hot ? 'hot' : null, String(b))); vt.appendChild(tr); };
  row('r（右端点）', st.r, st.kind === 'add' || st.kind === 'shrink' || st.kind === 'hit');
  row('l（左端点）', st.l, st.kind === 'shrink' || st.kind === 'reset');
  row('sum（窗口和）', st.sum, true);
  row('k（目标伤害）', k, false);
  row('ans（段数）', st.ans, st.kind === 'hit');
  row('窗口覆盖', st.win.length ? `[${st.win[0]}..${st.win[st.win.length - 1]}]` : '空窗', false);

  const sg = document.getElementById('segs'); sg.innerHTML = '';
  if (!st.segs.length) sg.appendChild(el('span', null, '（还没有收割）'));
  st.segs.forEach(s => sg.appendChild(el('span', 'sg', s + ' 和=' + k)));

  const note = document.getElementById('note'), prog = document.getElementById('prog');
  const ph = x => '<span class="phase">' + x + '</span>';
  if (st.kind === 'init') note.innerHTML = ph('读入') + `${n} 只怪物，目标伤害 <b>k = ${k}</b>。要找最多几段<strong>互不重叠</strong>、和恰好等于 ${k} 的连续区间。`;
  else if (st.kind === 'add') note.innerHTML = ph('扩窗') + `右端点移到 <b>r = ${st.r}</b>，<code>sum += a[${st.r}] = ${A[st.r - 1]}</code> → sum = <b>${st.sum}</b>。${st.sum > k ? '已经超过 k，得缩左边。' : (st.sum === k ? '正好等于 k！' : '还不到 k，继续往右。')}`;
  else if (st.kind === 'shrink') note.innerHTML = ph('缩窗') + `sum = ${st.sum} &gt; k ⇒ 左端点右移：<code>sum -= a[${st.l - 1}]</code>，l = <b>${st.l}</b>，现在 sum = <b>${st.sum}</b>。因为血量都是正数，缩左边一定让和变小，所以左端点从不后退。`;
  else if (st.kind === 'hit') note.innerHTML = ph('收割') + `sum == k ⇒ 找到以 ${st.r} 结尾的唯一合法段 <b>[${st.seg[0]}, ${st.seg[1]}]</b>，ans = <b>${st.ans}</b>。它结束得最早，先要它一定不亏。`;
  else if (st.kind === 'reset') note.innerHTML = ph('重置') + `第 ${st.r} 只及之前的怪物全部作废：<code>sum = 0; l = r + 1 = ${st.l}</code>，从下一只重新开始尺取。`;
  else note.innerHTML = ph('答案') + `<b>${st.ans}</b> —— 最多能打出 ${st.ans} 段互不重叠、伤害恰好 ${k} 的连击：${st.segs.join('、') || '（一段都没有）'}。`;
  prog.textContent = `步骤 ${t + 1} / ${steps.length}`;
  document.getElementById('prev').disabled = t === 0;
  document.getElementById('next').disabled = t === steps.length - 1;

  document.getElementById('code').innerHTML =
    CODE.map((l, i) => `<span class="ln${i === st.line ? ' cur' : ''}">${(i + 1 + '  ').padStart(3, ' ')} ${hi(l)}</span>`).join('');
}

function load() {
  const h = document.getElementById('hdr').value.trim().split(/\s+/).map(Number);
  k = Number.isFinite(h[1]) ? h[1] : 5;
  const parts = document.getElementById('src').value.trim().split(/[\s,]+/).map(Number).filter(v => Number.isFinite(v) && v > 0);
  A = parts.slice(0, 60);
  n = Math.min(A.length, Number.isFinite(h[0]) ? Math.max(1, h[0]) : A.length);
  A = A.slice(0, n);
  if (!n) return;
  t = 0; build(); render();
}

document.getElementById('next').onclick = () => { if (t < steps.length - 1) { t++; render(); } };
document.getElementById('prev').onclick = () => { if (t > 0) { t--; render(); } };
document.getElementById('load').onclick = load;
document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
  const [h, s] = b.dataset.s.split('|');
  document.getElementById('hdr').value = h; document.getElementById('src').value = s; load();
});
document.getElementById('jump').onclick = () => { t = steps.length - 1; render(); };
document.getElementById('play').onclick = e => {
  if (timer) { clearInterval(timer); timer = null; e.target.textContent = '▶ 自动播放'; return; }
  e.target.textContent = '⏸ 暂停';
  timer = setInterval(() => {
    if (t >= steps.length - 1) { clearInterval(timer); timer = null; e.target.textContent = '▶ 自动播放'; return; }
    t++; render();
  }, 420);
};

load();
</script>
</body>
</html>
